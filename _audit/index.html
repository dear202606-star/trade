<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>总览 · LEADER QUANT</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="assets/app.css?v=0a2445df">
<script src="assets/app.js?v=0a2445df"></script>
</head><body>
<script>DSH.boot();</script>
<div class="wrap">

  <div class="head">
    <div class="eyebrow">Leader Quant</div>
    <h1>今天该做什么</h1>
    <p id="pageSub"></p>
  </div>

  <div class="hero fade-in" style="position:relative">
    <div class="row" style="align-items:flex-start;gap:28px">
      <div class="grow" style="min-width:0">
        <div class="eyebrow" style="margin-bottom:12px">本月结论</div>
        <h2 id="verdict">—</h2>
        <div class="sub" id="verdictSub" style="margin:6px 0 0;font-size:13px"></div>
        <div class="hero-row">
          <div class="hero-item"><div class="label">大盘开关</div><div id="hTrend">—</div></div>
          <div class="hero-item"><div class="label">目标仓位</div><div class="num num-md" id="hExp">—</div></div>
          <div class="hero-item hero-cta"><a class="btn primary" id="ctaBtn" href="portfolio.html">看账户</a></div>
        </div>
      </div>

      <!-- 策略净值：进门第一眼的成绩单 -->
      <a href="strategy.html" class="eq-card" style="display:block;color:inherit;
         background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;
         padding:18px 20px;text-decoration:none">
        <div class="row" style="justify-content:space-between;align-items:baseline">
          <div class="label" style="margin:0">当期策略收益</div>
          <span style="font-size:11px;color:var(--txt-3)" id="eqPeriod">—</span>
        </div>
        <div class="num num-lg" id="eqRet" style="margin-top:6px">—</div>
        <div class="sub" id="eqSub" style="margin-top:2px"></div>
        <div id="eqToday" style="margin-top:8px"></div>
        <div id="eqSpark" style="margin-top:10px"></div>
      </a>
    </div>
  </div>

  <div style="margin-top:48px">
    <div class="label" style="font-size:12px">策略账户</div>
    <div id="pfBody"></div>
  </div>


  <div class="foot">
    美股收盘后更新 ｜ 仅供研究，不构成投资建议
  </div>
</div>

<script>
(async function () {
  const sig = await DSH.json('signal', null);
  const q = await DSH.json('quotes', {});
  const quotes = q.quotes || {};
  let pf = DSH.load();
  const targets = DSH.targets(sig);

  // 已绑定云端 → 以云端为准（本地仅是本次会话缓存）
  try {
    if (await DSH.cloud.init()) {
      if (DSH.cloud.bound) {
        const r = await DSH.cloud.pull();
        if (r && r.data && Array.isArray(r.data.rows)) { pf = r.data; DSH.save(pf); }
      }
    }
  } catch (e) { /* 云端不可用时用会话缓存渲染，不阻塞页面 */ }

  if (!sig) { document.getElementById('pageSub').textContent = '暂无信号数据'; return; }

  const off = sig.official || sig.picks || [];
  const exp = sig.exposure;
  const isDec = (sig.month || '').endsWith('-12');

  let verdict, lead;
  if (isDec) {
    verdict = '本月末换仓';
    lead = '按新名单重买 3 只';
  } else if (exp < 1) {
    verdict = '仓位减半';
    lead = '标普跌破 10 月均线';
  } else if (pf.rows.length) {
    verdict = '持有不动';
    lead = '12 月末换仓';
  } else {
    verdict = '持有不动';
    lead = '12 月末换仓';
  }
  document.getElementById('verdict').textContent = verdict;
  document.getElementById('verdictSub').textContent = lead;
  document.getElementById('pageSub').textContent = '';


  document.getElementById('hTrend').innerHTML =
    '<span class="pill ' + (exp >= 1 ? 'on' : 'off') + '">' + DSH.esc(sig.trend) + '</span>';
  document.getElementById('hExp').textContent = (exp * 100).toFixed(0) + '%';

  /* ---- 策略账户（理论账户，所有人一致） ---- */
  const cur = 'USD';
  const box = document.getElementById('pfBody');
  const EQ0 = await DSH.json('equity', null);
  const pos = (EQ0 && EQ0.position) || [];
  if (!pos.length) {
    box.innerHTML = '<div class="card" style="text-align:center;padding:52px 24px">' +
      '<div style="font-size:15px;color:var(--txt-2)">账户数据尚未生成</div></div>';
  } else {
    let amt = +(localStorage.getItem('dsh.amt') || 100000);
    if ([10000, 100000, 1000000].indexOf(amt) < 0) amt = 100000;
    const expx = EQ0.exposure != null ? EQ0.exposure : 1;
    const qmap = q.quotes || {};
    const parts = pos.map((p) => {
      const budget = amt * (p.weight || 0) * expx;
      const sh = p.entry > 0 ? budget / p.entry : null;
      const mv = sh != null && p.last > 0 ? sh * p.last : null;
      const qq = qmap[p.ticker] || {};
      return {
        ticker: p.ticker, name: qq.name || p.ticker, weight: p.weight,
        price: p.last, entry: p.entry, mv: mv, cost: budget,
        pnl: mv != null ? mv - budget : null,
        pnlPct: mv != null && budget > 0 ? (mv - budget) / budget : null,
        hasQuote: p.last > 0,
      };
    });
    const cash = amt * (1 - expx);
    const mvAll = parts.reduce((a, r) => a + (r.mv || 0), 0) + cash;
    const pnlAll = mvAll - amt;
    const pctAll = amt > 0 ? pnlAll / amt : null;

    const rowsHtml = parts.map((r) =>
      '<div class="holding">' +
        '<div><div class="tk">' + DSH.esc(r.ticker) + '</div>' +
          '<div class="nm">' + DSH.esc(r.name) + '</div>' +
          '<div class="nm" style="color:var(--txt-3)">现价 ' + (r.hasQuote ? r.price.toFixed(2) : '—') +
            ' · 建仓 ' + (r.entry != null ? r.entry.toFixed(2) : '—') + '</div></div>' +
        '<div><div class="label" style="margin:0 0 3px">市值</div>' +
          '<div class="num num-md">' + DSH.money(r.mv) + '</div></div>' +
        '<div style="text-align:right"><div class="label" style="margin:0 0 3px">盈亏</div>' +
          '<div class="num num-md ' + DSH.cls(r.pnl) + '">' + DSH.money(r.pnl) + '</div>' +
          '<div class="sub" style="margin-top:3px"><span class="' + DSH.cls(r.pnlPct) + '">' +
            DSH.pct(r.pnlPct) + '</span></div></div>' +
        '</div>').join('');

    box.innerHTML =
      '<div class="card" style="padding:26px 30px">' +
        '<div class="grid g4" style="gap:12px">' +
          '<div class="card flat"><div class="label" style="margin-bottom:6px">总市值</div>' +
            '<div class="num num-md">' + DSH.money(mvAll) + '</div></div>' +
          '<div class="card flat"><div class="label" style="margin-bottom:6px">本金</div>' +
            '<div class="num num-md">' + DSH.money(amt) + '</div></div>' +
          '<div class="card flat"><div class="label" style="margin-bottom:6px">当期累计盈亏</div>' +
            '<div class="num num-md ' + DSH.cls(pnlAll) + '">' + DSH.money(pnlAll) + '</div></div>' +
          '<div class="card flat"><div class="label" style="margin-bottom:6px">持有</div>' +
            '<div class="num num-md">' + parts.length + ' 只</div></div>' +
        '</div>' +
        '<div class="sub" id="pfStamp" style="margin-top:14px;font-size:11.5px;color:var(--txt-3)"></div>' +
      '</div>' +
      '<div class="grid" style="margin-top:14px;gap:10px">' + rowsHtml + '</div>';

    // 数据时间：让用户一眼知道这些数字是哪天的
    const stamp = document.getElementById('pfStamp');
    if (stamp) {
      let when = '';
      if (q.ts) {
        const d = new Date(q.ts);
        const p = (n) => String(n).padStart(2, '0');
        when = (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
      }
      stamp.innerHTML = (EQ0.base_date ? '建仓 ' + EQ0.base_date.slice(0,4) + '-' + EQ0.base_date.slice(4,6) + '-' + EQ0.base_date.slice(6,8) + ' ｜ ' : '') +
        (when ? '净值 ' + when + '（北京）' : '') +
        ((DSH.ageHours && DSH.ageHours(q.ts) > 26) ? ' ｜ <span style="color:#FFAB6B">⚠ 数据偏旧</span>' : '');
    }
  }

  /* ---- 策略净值迷你图 ---- */
  const eq = await DSH.json('equity', null);
  if (eq && eq.points && eq.points.length > 1) {
    const p0 = eq.points[0], pn = eq.points[eq.points.length - 1];
    const r = pn.s / p0.s - 1, br = pn.b / p0.b - 1;
    const el = document.getElementById('eqRet');
    el.textContent = DSH.pct(r);
    el.className = 'num num-lg ' + DSH.cls(r);
    document.getElementById('eqSub').innerHTML = '同期标普 <span class="' + DSH.cls(br) + '">' + DSH.pct(br) +
      '</span> ｜ 跑赢标普 500 <span class="' + DSH.cls(r - br) + '">' + DSH.pct(r - br) + '</span>';
    const bd = String(eq.base_date || '');
    const bdt = bd.length === 8 ? bd.slice(0, 4) + '/' + bd.slice(4, 6) + '/' + bd.slice(6, 8) : bd;
    document.getElementById('eqPeriod').textContent = bdt + ' 起 · ' + eq.points.length + ' 日';
    // 当前涨跌幅 + 金额（与账户页同一个 DSH.today 口径）
    const tdEq = DSH.today(sig, q);
    const eqT = document.getElementById('eqToday');
    if (eqT) {
      if (tdEq) {
        let amtNow = +(localStorage.getItem('dsh.amt') || 100000);
        const dayAmt = amtNow * tdEq.pct;
        const bg2 = tdEq.pct >= 0 ? 'rgba(255,90,95,.14)' : 'rgba(46,204,113,.14)';
        eqT.innerHTML = '<span style="display:inline-block;background:' + bg2 +
          ';border-radius:8px;padding:3px 9px;font-size:12.5px">' + tdEq.label + ' ' +
          '<b class="' + DSH.cls(tdEq.pct) + '">' + DSH.pct(tdEq.pct) + '</b>' +
          '<span style="color:var(--txt-3)"> · ' + DSH.money(dayAmt) + '</span></span>';
      } else {
        eqT.innerHTML = '';
      }
    }

    document.getElementById('ctaBtn').setAttribute('href', 'portfolio.html');
    let pk = 0;
    const dds = eq.points.map(p => { pk = Math.max(pk, p.s); return { d: p.d, y: p.s / pk - 1 }; });
    const tail = eq.points.slice(-120), tailDd = dds.slice(-120);
    document.getElementById('eqSpark').innerHTML = DSH.spark(tail.map(p => ({ y: p.s })), { w: 320, h: 88 });
  }

  /* ---- 下一步 ---- */
  // 页面打开期间每 5 分钟拉一次最新数据并重绘
  DSH.autoRefresh(5);
})();
</script>
</body></html>
