name: 数据质量核对

on:
  schedule:
    # 每月 1 日 02:00 UTC（选股后一小时）
    - cron: "0 2 1 * *"
  workflow_dispatch:
  push:
    paths:
      - market_data.py
      - crosscheck.py
      - .github/workflows/data-check.yml

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 实测 Yahoo 字段语义
        continue-on-error: true
        run: python probe_yahoo.py

      - name: 交叉核对两个数据源
        run: python crosscheck.py

      - name: 质量门禁
        id: gate
        continue-on-error: true
        run: python quality_gate.py

      - name: 质量告警（不达标时开 Issue）
        if: steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-alert --description "数据质量告警" --color B60205 --force || true
          BODY=$(cat output/quality_alert.md 2>/dev/null || echo "数据质量不达标，详见 output/data_quality.md")
          NUM=$(gh issue list --label data-alert --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh issue create --title "⚠️ 数据质量告警" --body "$BODY" --label data-alert
          else
            gh issue comment "$NUM" --body "$BODY"
          fi

      - name: 提交报告
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/data_quality.md output/data_quality.json output/yahoo_probe.txt output/splits.json output/quality_alert.md 2>/dev/null || git add -u output/
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore: 数据质量核对 $(date -u +%Y-%m)"
            git push
          fi

      - name: 摘要
        if: always()
        run: |
          echo "### 数据质量核对" >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/data_quality.md ]; then
            cat output/data_quality.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成报告" >> "$GITHUB_STEP_SUMMARY"
          fi
