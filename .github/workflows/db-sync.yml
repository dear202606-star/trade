name: 备库同步

# 「一主两备」的复制链路（2026-11-08）
#   A 层 Turso（libsql HTTP，浏览器可直读）：交易时段 30 分钟一次，
#     与 quotes.yml 的盘中采集节奏对齐；只传变化的展示行，典型 0~3 行。
#   B 层 Neon（PostgreSQL 持久副本）：**每工作日只唤醒一次**（收盘后），
#     Neon Free 的计算时长/自动休眠是稀缺资源，绝不能按 30 分钟频率连接。
#     全 24 表的灾难恢复另由 db-backup.yml + restore_to_neon.py 负责。
#   主库读取走 PostgreSQL 直连，单次约 150KB；按 egress_budget 门禁受控，
#   且「备库同步」已登记为关键链路，freeze 档也放行（否则备库会停更）。
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '同步目标'
        required: false
        default: 'turso,neon'
        type: choice
        options:
          - 'turso'
          - 'neon'
          - 'turso,neon'
  schedule:
    - cron: "*/30 13-20 * * 1-5"   # 交易时段：仅 Turso（再由 NYSE 日历门禁收窄）
    # 2026-11-10：原 21:10 UTC 比 quotes.yml 的 21:17 收盘采集还早，
    # 会把「前一日」数据同步到备库；移到 21:55（晚于 21:50 兜底采集）。
    - cron: "55 21 * * 1-5"        # 收盘关键：Turso + Neon（Neon 唯一唤醒点）
    # 2026-11-08：原 05:00 UTC = 北京 13:00，迁到北京 05:00，避开非交易时段。
    - cron: "0 21 * * 0,6"         # 周末低频心跳：仅 Turso，数据不变时 0 行写入
  push:
    branches: [main]
    paths:
      - sync_site_dataset.py
      - export_site_snapshot.py
      - db_sources.py
      - egress_budget.py
      - trading_window.py
      - research/exchange_calendar.json
      - test_trading_window.py
      - .github/workflows/db-sync.yml

concurrency:
  group: trade-db-sync
  # 2026-11-10：采集成功后会立即派发一次同步；若此时定时同步启动并
  # cancel-in-progress，恰好把「刚采到的数据」那一次砍掉，页面继续停更。
  # 改为排队执行（增量同步幂等，重复跑 0 行写入），绝不取消在途同步。
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      # 2026-11-08：休市日不再做 30 分钟 Turso 同步，更不唤醒 Neon 计算实例。
      # 周末低频心跳保留（task=heartbeat），用于复制一致性校验，0 行写入。
      - name: 交易时段门禁（NYSE 已复核日历）
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "0 21 * * 0,6") TASK=heartbeat ;;
            "55 21 * * 1-5") TASK=closing ;;
            *) TASK=intraday ;;
          esac
          python3 trading_window.py --task "$TASK" --gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: 按调度选择同步目标（免费额度规划）
        id: plan
        if: steps.gate.outputs.allow == 'true'
        shell: bash
        run: |
          MANUAL="${{ github.event.inputs.targets }}"
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "$MANUAL" ]; then
            TARGETS="$MANUAL"
            REASON="手动触发"
          elif [ "$SCHEDULE" = "55 21 * * 1-5" ]; then
            TARGETS="turso,neon"
            REASON="收盘关键同步：Turso + Neon 持久副本"
          else
            TARGETS="turso"
            REASON="交易时段/周末心跳：仅 Turso，不唤醒 Neon"
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "计划：$REASON -> $TARGETS"

      - name: 出口流量门禁
        id: egress
        if: steps.gate.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRADE_FORCE_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python egress_budget.py --workflow "备库同步" --fast

      - name: 增量同步展示数据
        if: steps.gate.outputs.allow == 'true' && steps.egress.outputs.allow == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TURSO_HTTP_URL: ${{ secrets.TURSO_HTTP_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEON_DSN: ${{ secrets.NEON_DSN }}
        run: python sync_site_dataset.py --targets "${{ steps.plan.outputs.targets }}"
