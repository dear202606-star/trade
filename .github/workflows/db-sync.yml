name: 备库同步

# 收盘计算结束触发 Turso 增量复制。每天收盘后另有一次备库兜底。
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '同步目标'
        required: false
        default: 'turso,neon'
        type: choice
        options:
          - 'turso'
          - 'neon'
          - 'turso,neon'
  schedule:
    - cron: "55 16 * * 1-5"
      timezone: "America/New_York"

concurrency:
  group: trade-db-sync
  # 2026-11-10：采集成功后会立即派发一次同步；若此时定时同步启动并
  # cancel-in-progress，恰好把「刚采到的数据」那一次砍掉，页面继续停更。
  # 改为排队执行（增量同步幂等，重复跑 0 行写入），绝不取消在途同步。
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 收盘场次门禁
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 trading_window.py --closing-only --gate
          else
            echo 'allow=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: 按调度选择同步目标（免费额度规划）
        id: plan
        if: steps.gate.outputs.allow == 'true'
        shell: bash
        run: |
          MANUAL="${{ github.event.inputs.targets }}"
          TARGETS="${MANUAL:-turso,neon}"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: 出口流量门禁
        id: egress
        if: steps.gate.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRADE_FORCE_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python egress_budget.py --workflow "备库同步" --fast --critical

      - name: 增量同步展示数据
        if: steps.gate.outputs.allow == 'true' && steps.egress.outputs.allow == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TURSO_HTTP_URL: ${{ secrets.TURSO_HTTP_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEON_DSN: ${{ secrets.NEON_DSN }}
        run: python sync_site_dataset.py --targets "${{ steps.plan.outputs.targets }}"
