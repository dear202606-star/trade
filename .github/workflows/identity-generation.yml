name: 证券身份生成防护回归

on:
  push:
    branches: [main]
    paths:
      - db_ref.py
      - strategy_history.py
      - variant_b.py
      - test_identity_generation_guard.py
      - test_merger_boundaries.py
      - test_missing_holding_months.py
      - runner.py
      - publish_pipeline_status.py
      - test_pipeline_status.py
      - preview.py
      - test_online_preview.py
      - sql/112_bcr_cam_merger_boundaries.sql
      - .github/workflows/identity-generation.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_identity_generation_guard test_merger_boundaries test_missing_holding_months
      - name: 运行状态入库与失败传递
        run: python -m unittest test_pipeline_status
      - name: 在线预览输入与候选完整性
        run: python -m unittest test_online_preview
