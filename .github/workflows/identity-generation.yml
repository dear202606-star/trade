name: 证券身份生成防护回归

on:
  push:
    branches: [main]
    paths:
      - db_ref.py
      - db_select.py
      - db_prices.py
      - test_single_series.py
      - research/verify_selected_fingerprint.py
      - test_source_selection.py
      - fill_yahoo_gaps.py
      - lock_symbols.py
      - lock_stage.py
      - verify_locks.py
      - test_historical_backfill_guards.py
      - test_sun_quarantine.py
      - sql/119_sun_identity_quarantine.sql
      - sql/120_source_aware_nominal_fact_guards.sql
      - research/verify_nominal_acceptance_guards.py
      - historical_lineage.py
      - test_historical_lineage.py
      - research/install_historical_identity_reviews.py
      - sql/121_historical_identity_review_guards.sql
      - fetch_stockanalysis.py
      - test_stockanalysis_history.py
      - strategy_history.py
      - variant_b.py
      - test_identity_generation_guard.py
      - test_merger_boundaries.py
      - test_missing_holding_months.py
      - runner.py
      - publish_pipeline_status.py
      - test_pipeline_status.py
      - preview.py
      - test_online_preview.py
      - test_recent_index_changes.py
      - research/apply_recent_index_changes.py
      - sql/113_reviewed_index_boundaries.sql
      - sql/112_bcr_cam_merger_boundaries.sql
      - .github/workflows/identity-generation.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 档案隔离与选源口径
        run: python -m unittest test_source_selection test_historical_backfill_guards test_sun_quarantine test_historical_lineage test_single_series
      - name: 原价验收来源与不可变守卫影子验证
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python research/verify_nominal_acceptance_guards.py
      - name: 选中输入指纹真实变更探针
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python research/verify_selected_fingerprint.py
      - run: python -m unittest test_identity_generation_guard test_merger_boundaries test_missing_holding_months
      - name: 运行状态入库与失败传递
        run: python -m unittest test_pipeline_status
      - name: 在线预览输入与候选完整性
        run: python -m unittest test_online_preview test_recent_index_changes test_stockanalysis_history
