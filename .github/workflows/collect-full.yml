name: 采集与锁定（CI 主力，写库）

# 目标：采集全部在 GitHub Actions（美国出口）完成，直接写库。
# 依赖：仓库 secret SUPABASE_DB_PASSWORD（已验证可用）
# 顺序：补数 → 重建选源 → 校验 → 锁新达标的标的
# 补数步（stockanalysis / Yahoo）的失败不中断链路，改由末尾「采集故障收口」举红：
# 缺月是两只票的事，不该让每晚的选源重建和锁校验一起 skipped。
# 2026-11-07：加入 trade-pipeline 互斥组。此前本工作流与 collect-ci 无并发
# 保护，而两者最终都写 prices_monthly（collect-ci 经 pg_cron promote_staging
# 合并），存在并发 upsert 覆盖与锁判定竞态。

concurrency:
  group: trade-pipeline
  cancel-in-progress: false

on:
  schedule:
    # 2026-11-21「先砍流量」：本作业是历史价格主力（补数 → 重建选源 → 校验 → 锁），
    # 页面读数完全不经过它，每 6 小时跑一次没有换来任何前端新鲜度，只换来
    # fill_yahoo_gaps 每轮重打同一批取不到的标的。改成每天收盘后一次。
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      av_quota:
        description: "本次 Alpha Vantage 调用上限"
        required: false
        default: "24"
      sa_limit:
        description: "本次 stockanalysis 处理标的数"
        required: false
        default: "120"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -q -r requirements.txt

      - name: 档案隔离、选源口径与中继选择回归
        # test_yahoo_relay_selection 押的是下面 fill_yahoo_gaps 的两条不变量
        # （最完整的响应胜出、一轮扫完机群）；test_verify_locks 押的是下面
        # 「校验锁」那一步的隔离判据。CI 用显式模块列表，不列就等于不跑。
        run: python -m unittest test_source_selection test_historical_backfill_guards test_yahoo_relay_selection test_verify_locks

      - name: 写入数据库口令
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p output
          printf '%s' "$SUPABASE_DB_PASSWORD" > output/_supabase_dbpass.txt
          echo "口令长度 ${#SUPABASE_DB_PASSWORD}"

      # 缺席结案台账：fill_yahoo_gaps.targets() 要 join source_absence_acceptance。
      # 表不在 → 整轮采集抛 relation does not exist → 真实缺口反而一个也补不进。
      # 本仓库没有自动迁移器（apply_sql.py 不在任何工作流里，DDL 全靠人工执行），
      # 所以由作业自己幂等地兜住这一步，人工漏跑不再等于全线停摆。
      # 128 放宽台账的 reason/http_status 形状（判据在 source_absence.close_covered_absence）。
      - name: 应用缺席结案台账（纯库内 DDL，幂等）
        run: |
          python - <<'PY'
          import db_sources
          from pathlib import Path
          c = db_sources.db(); c.autocommit = True
          try:
              with c.cursor() as cur:
                  for f in ('sql/127_source_absence_acceptance.sql',
                            'sql/128_source_absence_covered_history.sql'):
                      cur.execute(Path(f).read_text(encoding='utf-8'))
                      print('applied', f)
          finally:
              c.close()
          PY

      # 采集类步骤的红只留给「重试还可能补出来」的真故障：已知补不出的（退市票权威
      # Not Found、代码被重新上市占用、窗口已被选中序列铺满）各自有出口，不在此列。
      # 若在这里直接让作业终止，后面 重建选源/校验/初筛/事件/锁校验/结构冒烟 会被
      # 整批 skipped（2026-11-22 run 45017902155、45007701439 实测），等于让两只票
      # 冻结每晚的选源重建——正是单符号隔离决策要消灭的形态。所以这两步只记 outcome，
      # 红由作业末尾的「采集故障收口」统一举：既不变绿，也不冻结下游。
      - name: stockanalysis 补缺（免费，10 年全收益）
        id: stockanalysis
        if: ${{ github.event.inputs.sa_limit != '0' }}
        continue-on-error: true
        env:
          SA_LIMIT: ${{ github.event.inputs.sa_limit }}
        run: |
          N="${SA_LIMIT:-120}"
          if [ "$N" = "0" ]; then echo "跳过 stockanalysis"; exit 0; fi
          python fetch_stockanalysis.py --symbols "$N"

      # Alpha Vantage 每天 25 次额度：交给 daily-backfill（每天 04:00、16:00 UTC）单独跑，
      # 这里不跑，否则每 6 小时跑一次会 4 倍超量、全部失败。

      - name: 给「选源非全收益」的标的补 Yahoo 全收益
        id: yahoo
        continue-on-error: true
        run: python fill_yahoo_gaps.py --limit 400 --max-seconds 900

      - name: 重建选源（每票单源）
        run: python db_select.py

      - name: 校验入库（validations）
        run: python db_validate.py

      - name: 历史覆盖初筛（不创建验收锁）
        run: python lock_symbols.py --check

      - name: 采集分红/拆股事件（让全收益可独立复算）
        run: python fetch_actions.py --limit 160

      - name: 校验锁是否仍然有效
        run: python verify_locks.py

      - name: 结构冒烟
        run: python schema_check.py --quick

      - name: 汇总
        run: |
          python - <<'PY'
          import db_prices, db_select
          import psycopg2
          c = db_prices.connect()
          with c.cursor() as cur:
              cur.execute("select count(*), count(distinct symbol), "
                          "count(*) filter (where basis='total_return') from series_selected")
              n, s, tr = cur.fetchone()
              cur.execute("select count(*) from locked_symbols")
              lk = cur.fetchone()[0]
              cur.execute("select count(*) from validations where status='fail'")
              bad = cur.fetchone()[0]
          print("series_selected %d 行 / %d 只 / 全收益 %.1f%% ｜ 已锁 %d 只 ｜ 校验失败 %d 条"
                % (n, s, 100.0 * tr / max(1, n), lk, bad))
          PY

      # 必须放在末尾：上面全跑完才有意义。红是真的——只报「重试还可能补出来」的缺口，
      # 补不出来的各有出口（权威 Not Found 与窗口已完整落结案台账，代码被重新上市占用
      # 每轮重取证据但不落账；2026-11-22 预演点名的 LIFE、TGNA 都归后者）。
      # 但红的位置不能挡住 nightly 重建选源。
      - name: 采集故障收口（真缺口举红，但不冻结下游）
        if: ${{ steps.stockanalysis.outcome == 'failure' || steps.yahoo.outcome == 'failure' }}
        run: |
          echo "::error::采集有未结案的真故障：stockanalysis outcome=${{ steps.stockanalysis.outcome }} yahoo outcome=${{ steps.yahoo.outcome }}（各步日志给了票名；已结案的可查 source_absence_acceptance）"
          exit 1
