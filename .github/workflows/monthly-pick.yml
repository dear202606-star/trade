name: 每日全量更新

concurrency:
  group: trade-pipeline
  cancel-in-progress: false

# 历史研究与回放按需运行，正式站引用已封存的历史数据集。
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write


jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 写入数据库口令
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p output
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            printf '%s' "$SUPABASE_DB_PASSWORD" > output/_supabase_dbpass.txt
          else
            echo "::warning::SUPABASE_DB_PASSWORD 未配置，将退回缓存/旧数据"
          fi

      - name: 运行选股与排名
        id: pick
        run: python runner.py monthly_pick.py --workers 10

      - name: 抓取行情快照
        continue-on-error: true
        run: python runner.py quotes.py

      - name: 计算策略净值
        continue-on-error: true
        run: python runner.py equity.py
      - name: 生成全年成分口径（B）
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BASELINE_MODE: observe
        run: python runner.py variant_b.py

      - name: 计算 B 口径净值
        env:
          EQ_SIGNAL: output/signal_history_b.json
          EQ_OUT: docs/data/b/equity.json
        run: python runner.py equity.py

      - name: 生成逐年记录
        run: python runner.py strategy_history.py

      - name: 口径 B 独立审计
        run: python runner.py audit_b.py

      - name: 生成站点
        id: site
        run: python runner.py site_build.py

      - name: 研究结果自检
        run: python runner.py selftest.py

      - name: 在线保存流水线状态
        if: always()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
        run: python publish_pipeline_status.py

      - name: 保留本次运行回执
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/pipeline_status_run.json
          if-no-files-found: error
          retention-days: 30

      # 已停用：站点是唯一信息源，不再往 Issue 推送重复内容
      - name: 摘要
        if: always()
        run: |
          echo "### 月度选股结果" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ] && [ -f output/monthly/latest.md ]; then
            tail -n +3 output/monthly/latest.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🌐 https://dear202606-star.github.io/trade/signals.html" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ 本次运行失败，未生成新报告，请查看上方日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 失败时开 Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `流水线失败 ${new Date().toISOString().slice(0,10)}`;
            const body = `运行 [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 失败。\n\n站点可能停更，请检查。`;
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'pipeline'});
            if (issues.data.length === 0) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['pipeline']});
            }
