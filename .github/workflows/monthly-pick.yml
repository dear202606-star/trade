name: 月度选股

on:
  schedule:
    # 每月 1 日 01:00 UTC = 北京时间 09:00
    - cron: "0 1 1 * *"
  workflow_dispatch:
  # 修改选股脚本或本工作流时自动跑一次，便于验证
  # （github-actions[bot] 用 GITHUB_TOKEN 提交不会触发，因此不会循环）
  push:
    branches: [main]
    paths:
      - monthly_pick.py
      - requirements.txt
      - .github/workflows/monthly-pick.yml

permissions:
  contents: write

concurrency:
  group: monthly-pick
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行月度选股
        id: pick
        run: python monthly_pick.py --workers 10

      - name: 提交结果
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/current_picks.csv output/current_picks_full.csv output/monthly
          if git diff --staged --quiet; then
            echo "本月无变更，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: 月度选股更新 $(date -u +%Y-%m)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 摘要
        if: always()
        run: |
          echo "### 月度选股结果" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.pick.outcome }}" = "success" ] && [ -f output/monthly/latest.md ]; then
            tail -n +3 output/monthly/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ 本次运行失败，未生成新报告，请查看上方日志。" >> "$GITHUB_STEP_SUMMARY"
          fi
