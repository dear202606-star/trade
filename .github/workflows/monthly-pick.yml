name: 每日全量更新

on:
  schedule:
    # 收盘后全量：22:00 UTC = 北京 06:00（拿到当日收盘价）
    - cron: "0 22 * * *"
    # 兜底：11:00 UTC = 北京 19:00（保证 20:00 前数据是最新的）
    - cron: "0 11 * * *"
    # 每周日 03:00 UTC = 北京 11:00：生存者偏差审计
    - cron: "0 3 * * 0"
  workflow_dispatch:
  # 修改任何管道脚本时自动跑一次（bot 用 GITHUB_TOKEN 提交不会触发，不会循环）
  push:
    branches: [main]
    paths:
      - monthly_pick.py
      - market_data.py
      - quotes.py
      - equity.py
      - strategy_history.py
      - datafeed.py
      - selftest.py
      - verify_champions.py
      - dashboard.py
      - site_build.py
      - report_live.py
      - publish_signal.py
      - track_record.py
      - survivorship.py
      - requirements.txt
      - .github/workflows/monthly-pick.yml

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write


jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行选股与排名
        id: pick
        run: python monthly_pick.py --workers 10

      - name: 抓取行情快照
        continue-on-error: true
        run: python quotes.py

      - name: 计算策略净值
        continue-on-error: true
        run: python equity.py

      - name: 生成逐年记录
        continue-on-error: true
        run: python strategy_history.py

      - name: 生成站点
        id: site
        run: python site_build.py

      - name: 生存者偏差审计（每周日跑一次，较慢）
        if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'
        continue-on-error: true
        timeout-minutes: 8
        run: python survivorship.py --probe || echo "审计跳过"

      - name: 部署前自检（数据不全就不部署）
        run: python selftest.py

      - name: 上传 Pages 产物
        if: steps.pick.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 提交结果
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/current_picks.csv output/current_picks_full.csv \
                  output/monthly output/signal_history.json output/dashboard.html \
                  output/track_record.json output/survivorship.json output/survivorship.md \
                  "output/排名策略对比.html" "output/策略模型研究与行动步骤.html" output/splits.json
          if git diff --staged --quiet; then
            echo "本期无变更，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +%Y-%m)"
            git push
          fi

      - name: 发布信号通知
        if: steps.pick.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_signal.py

      - name: 摘要
        if: always()
        run: |
          echo "### 月度选股结果" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.pick.outcome }}" = "success" ] && [ -f output/monthly/latest.md ]; then
            tail -n +3 output/monthly/latest.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🌐 https://dear202606-star.github.io/trade/signals.html" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ 本次运行失败，未生成新报告，请查看上方日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: pick
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
