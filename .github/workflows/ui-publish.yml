name: 网页发布

# 页面发布复用在线数据，验收并锁定已发布历史后部署。
# 每日收盘数据由净值与排名工作流更新。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site_src/**
      - publish_ui.py
      - publish_site_dataset.py
      - export_site_snapshot.py
      - sync_site_dataset.py
      - verify_replication.py
      - db_failover.py
      - test_replication.py
      - site_build.py
      - .github/workflows/db-sync.yml
      - live_strategy.py
      - prepare_live_ranking.py
      - test_closing_reconcile.py
      - reconcile_sessions.py
      - test_reconcile_sessions.py
      - test_publish_ui.py
      - test_ranking_factor_rebase.py
      - test_cross_session_dividend.py
      - test_watchdog_gateway.py
      - test_egress_budget.py
      - egress_budget.py
      - run_guard.py
      - db_backup.py
      - realtime_check.py
      - watchdog_site_check.py
      - sql/122_site_dataset.sql
      - sql/126_frozen_site_history.sql
      - trading_window.py
      - research/exchange_calendar.json
      - test_trading_window.py
      - .github/workflows/ui-publish.yml

concurrency:
  group: trade-ui-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  # 2026-11-08：定时发布只在 NYSE 交易日执行；push / 手动触发一律放行。
  # 注意：本 job 不能写 `if: github.event_name == 'schedule'` —— 实测被跳过的
  # job 会沿 needs 链把 deploy 也一起跳过，导致「build 成功但 Pages 没部署」。
  # 改成始终运行、由门禁脚本自行放行非 schedule 触发（只多一次 checkout + 1 条命令）。
  calendar_gate:
    runs-on: ubuntu-latest
    outputs:
      allow: ${{ steps.gate.outputs.allow }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 trading_window.py --task publish --gate
  build:
    needs: calendar_gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.calendar_gate.outputs.allow == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - run: node --test test_daily_pnl.mjs test_online_quotes.mjs test_page_refresh.mjs
      - run: python -m unittest test_live_strategy test_live_ranking test_live_quotes test_watchdog_checks test_backfill test_external_heartbeat test_intraday_skip test_reconcile_outputs test_closing_reconcile test_ranking_factor_rebase test_cross_session_dividend test_watchdog_gateway test_egress_budget test_replication test_trading_window test_reconcile_sessions test_publish_ui -v
      - name: 保留已部署数据并构建界面
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_ui.py
      - name: 展示数据入库并剔除 Pages 静态数据
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python publish_site_dataset.py --install --source _site_release/data --prune
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_release
          retention-days: 30
  deploy:
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
