name: 网页发布

# 发布职责（2026-11-07 起）：
#   1) 构建前端并保留上一份已部署的数据基线
#   2) 把构建期展示数据写入在线库（唯一主源），剔除 Pages 上的历史数据 JSON
#   3) 通过 PostgreSQL 直连从在线库导出一份同源只读镜像 data/snapshot.json
#      —— REST 网关被限流(402)时页面靠它完整渲染，且静态层读它可消除大部分出口流量
#   4) 原子部署。镜像导出校验不通过即整体失败，绝不用半份数据上线。
# 定时触发用于刷新镜像：按 data_lifecycle.py 的 DAILY 策略，数据管线每日
# 收盘后产出，故只保留「盘前 + 盘后」两次，去掉原先无新数据的盘中第三次。
on:
  workflow_dispatch:
  schedule:
    - cron: "40 12,22 * * 1-5"
  push:
    branches: [main]
    paths:
      - site_src/**
      - publish_ui.py
      - publish_site_dataset.py
      - export_site_snapshot.py
      - live_strategy.py
      - prepare_live_ranking.py
      - test_closing_reconcile.py
      - test_ranking_factor_rebase.py
      - watchdog_site_check.py
      - sql/122_site_dataset.sql
      - .github/workflows/ui-publish.yml

concurrency:
  group: trade-ui-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - run: node --test test_daily_pnl.mjs test_online_quotes.mjs test_page_refresh.mjs
      - run: python -m unittest test_closing_reconcile test_ranking_factor_rebase -v
      - name: 保留已部署数据并构建界面
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_ui.py
      - name: 展示数据入库并剔除 Pages 静态数据
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python publish_site_dataset.py --install --source _site_release/data --prune
      - name: 从在线库直连导出同源展示镜像
        # 直连不经过 PostgREST 网关：即使网关因 egress 配额返回 402，
        # 数据库本身可用时仍能导出，这是页面「绝对可靠」的兜底来源。
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python export_site_snapshot.py --target _site_release/data/snapshot.json
      - name: 镜像完整性复核
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('_site_release/data/snapshot.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d.get('schema') == 1, 'bad schema'
          assert d.get('source') == 'postgres-direct', 'bad source'
          need = {'quotes','equity','b/equity','signal','b/signal','preview','b/preview',
                  'curve','b/curve','strategy_history','b/strategy_history',
                  'name_zh','sectors','health'}
          have = set(d['datasets'])
          assert need <= have, 'missing datasets: %s' % sorted(need - have)
          print('snapshot OK: %d keys, %d bytes, generated_at=%s'
                % (len(have), p.stat().st_size, d['generated_at']))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_release
          retention-days: 30
  deploy:
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
