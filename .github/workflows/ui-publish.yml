name: 网页发布

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site_src/**
      - publish_ui.py
      - .github/workflows/ui-publish.yml

concurrency:
  group: trade-ui-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - run: node --test test_daily_pnl.mjs test_online_quotes.mjs test_page_refresh.mjs
      - name: 保留已部署数据并构建界面
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_ui.py
      - name: 展示数据入库并剔除 Pages 静态数据
        # 2026-11-06：页面改为只连在线库。首轮发布先建表+写库，再删 Pages 产物中的
        # 数据 JSON；后续稳态发布产物仅含 cloud.json，脚本校验在线库齐备后直接放行。
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python publish_site_dataset.py --install --source _site_release/data --prune
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_release
          retention-days: 30
  deploy:
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
