name: 在线净值与动态排名

on:
  workflow_run:
    workflows: [行情快照]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - live_strategy.py
      - live_ranking.py
      - live_quotes.py
      - run_guard.py
      - test_intraday_skip.py
      - live_cash_dividends.py
      - prepare_live_ranking.py
      - egress_budget.py
      - test_egress_budget.py
      - test_live_strategy.py
      - test_live_ranking.py
      - test_live_cash_dividends.py
      - .github/workflows/live-strategy.yml

permissions:
  contents: read
  # 2026-11-11：计算完成后要派发 db-sync.yml 把结果推进 Turso，
  # actions: read 只够 egress_budget 读运行记录，派发需要 write。
  actions: write

jobs:
  equity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: trade-current-equity
      cancel-in-progress: false
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_live_strategy test_live_cash_dividends test_intraday_skip
      - name: 出口流量预算门禁
        id: egress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python egress_budget.py --workflow "在线净值与动态排名" --fast --critical
      - name: 净值计算（含场次幂等）
        if: steps.egress.outputs.allow == 'true'
        run: python live_strategy.py
  ranking:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: trade-current-ranking
      cancel-in-progress: false
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_live_ranking test_intraday_skip
      - name: 出口流量预算门禁
        id: egress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python egress_budget.py --workflow "在线净值与动态排名" --fast --critical
      - name: 动态排名与次年预览（含场次幂等）
        if: steps.egress.outputs.allow == 'true'
        run: python live_ranking.py

  sync_outputs:
    # 2026-11-11：备库同步原先只由 quotes.yml 采集成功派发，发生在净值
    # 计算之前；算完的 equity / preview 要等下一轮定时同步才进 Turso，
    # 页面「净值截至」因此连续 4 天停更。任一计算 job 成功就立即推一次
    # 增量同步（只推 Turso、不唤醒 Neon），把「计算 → 落地」变成顺序链。
    # ranking 失败时也照样推 equity，不让一条失败拖住另一条已成功的结果。
    if: >-
      always() &&
      (needs.equity.result == 'success' || needs.ranking.result == 'success')
    needs: [equity, ranking]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh workflow run db-sync.yml -f targets=turso || \
            echo "::warning::计算后同步派发失败，输出对账将在下一轮兜底"
