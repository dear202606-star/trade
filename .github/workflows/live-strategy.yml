name: 在线净值与动态排名

on:
  workflow_run:
    workflows: [行情快照]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - live_strategy.py
      - live_ranking.py
      - live_quotes.py
      - run_guard.py
      - test_intraday_skip.py
      - live_cash_dividends.py
      - prepare_live_ranking.py
      - test_cross_session_dividend.py
      - test_ranking_factor_rebase.py
      - egress_budget.py
      - test_egress_budget.py
      - test_live_strategy.py
      - test_live_ranking.py
      - test_live_cash_dividends.py
      - .github/workflows/live-strategy.yml

permissions:
  contents: read
  # 2026-11-11：计算完成后要派发 db-sync.yml 把结果推进 Turso，
  # actions: read 只够 egress_budget 读运行记录，派发需要 write。
  actions: write

jobs:
  equity:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: trade-current-equity
      cancel-in-progress: false
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_live_strategy test_live_cash_dividends test_intraday_skip
      - name: 出口流量预算门禁
        id: egress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python egress_budget.py --workflow "在线净值与动态排名" --fast --critical
      - name: 净值计算（含场次幂等）
        if: steps.egress.outputs.allow == 'true'
        id: compute
        run: python live_strategy.py
  ranking:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: trade-current-ranking
      cancel-in-progress: false
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_live_ranking test_intraday_skip test_ranking_factor_rebase test_cross_session_dividend
      - name: 出口流量预算门禁
        id: egress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python egress_budget.py --workflow "在线净值与动态排名" --fast --critical
      - name: 动态排名与次年预览（含场次幂等）
        if: steps.egress.outputs.allow == 'true'
        id: compute
        run: python live_ranking.py
  sync_outputs:
    needs: [equity, ranking]
    if: ${{ needs.equity.result == 'success' && needs.ranking.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 同步已结算的净值与排名
        run: gh workflow run db-sync.yml --repo "$GITHUB_REPOSITORY" -f targets=turso
