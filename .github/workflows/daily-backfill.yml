name: 每日补数与校验

# 按 source_registry（Supabase）的调度顺序分工执行，互不重复：
#   Alpha Vantage 25 次/天 → 只补退市票等「别人做不了」的历史
#   HF（无限额度）        → 现役票的 12 月缺口
#   新浪（本地）           → 退市票的桥接
#   EODHD（20 次/天）      → 近 13 个月交叉校验
# 需要仓库 Secrets：ALPHAVANTAGE_API_KEY / EODHD_API_TOKEN / SUPABASE_DB_PASSWORD

on:
  schedule:
    # 每日一次；Alpha Vantage 调用额度由数据库原子预约统一限制
    - cron: "0 10 * * *"      # 18:00 北京时间
  workflow_dispatch:
    inputs:
      av_limit:
        description: "Alpha Vantage 本次调用数"
        required: false
        default: "24"

concurrency:
  group: trade-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -q pandas requests lxml psycopg2-binary curl_cffi

      - name: 补数与档案隔离回归
        run: python -m unittest test_data_pipeline test_nominal_prices test_holding_consideration test_holding_paths test_eastmoney_nominal test_security_membership test_liquidity_prices

      - name: 恢复已取得的月线响应（不含凭据）
        uses: actions/cache@v4
        with:
          path: output/_av_monthly_native
          key: av-native-v1-${{ github.run_id }}
          restore-keys: av-native-v1-

      - name: 写入数据库口令
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p output
          printf '%s' "$SUPABASE_DB_PASSWORD" > output/_supabase_dbpass.txt

      - name: 生成当日分工计划
        run: python allocate_work.py

      - name: 核验并补充名义股价（共享 AV 日额度）
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          AV_LIMIT: ${{ github.event.inputs.av_limit }}
        run: |
          python - <<'PY'
          import os
          import collect_av_nominal, relay_source
          budget = int(os.environ.get('AV_LIMIT') or 24)
          if not 0 <= budget <= 25:
              raise SystemExit('AV 调用预算须为 0..25')
          used = relay_source.av_used_last_24h()
          if used is None:
              raise SystemExit('无法核实共享额度，不发起请求')
          collect_av_nominal.run(min(8, max(0, budget - used)), write=True)
          PY

      - name: Alpha Vantage 分片（退市票优先）
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          AV_LIMIT: ${{ github.event.inputs.av_limit }}
        run: |
          python relay_source.py --plan-source alphavantage --symbols "${AV_LIMIT:-24}" --av-quota "${AV_LIMIT:-24}"

      - name: stockanalysis 补退市票（免费，10 年全收益）
        continue-on-error: true
        run: python fetch_stockanalysis.py --symbols 80

      - name: HF 分片（现役票覆盖）
        run: python relay_source.py --plan-source hf_ayushkhaire --symbols 120 --no-av

      - name: 新浪桥接（退市票）
        run: python relay_source.py --plan-source sina_local --symbols 60 --no-av

      - name: EODHD 交叉校验（近 13 个月）
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        continue-on-error: true
        run: python crosscheck_eodhd.py

      - name: 数据库质量验收
        run: python db_validate.py --data-only
