name: 场次对账（自动补采）
# 运行标题带触发来源，让「平台外心跳存活」监控能精确识别 pg-cron，
# 不会把手动 workflow_dispatch 误算成心跳（external_heartbeat.is_tick_run）。
run-name: "场次对账 · ${{ github.event.inputs.source || github.event.client_payload.source || github.event_name }}"

# 2026-11-10：把「自动执行」从依赖 cron 准点，改成依赖「数据齐不齐」。
#
# 共模故障复盘：GitHub 免费版 scheduled events 是尽力而为，实测 21:17 / 21:50
# 的收盘任务被延迟到次日 03:35 / 03:49（约 6 小时），11-10 整个盘中
# 13:00~15:13 UTC 一次都没触发；而原自愈挂在看门狗里，看门狗自己也是
# schedule 触发 —— 被兜底者与兜底者同时哑火，页面连续停更数天。
#
# 本工作流用三条互相独立的触发源破除单点：
#   ① workflow_run：上游「跑完了」就对账，成功/失败都触发，不依赖准点；
#   ② 独立错峰 cron：所有上游都没跑时仍能自主发现缺口；
#   ③ 手动 / push：随时可验证。
# 对账只读浏览器同源的 Turso 公开端点，纯标准库、不装依赖、不连主库，
# 单次约 10 秒，不消耗 Supabase egress；数据已齐绝不派发，避免自激循环。

on:
  workflow_run:
    # 「行情快照」只在失败时纳入对账（见下方 job 级 if）：它成功后会异步
    # 派发备库同步，此刻 Turso 可能还没落地，对账会把「同步在途」误判成
    # 「采集缺失」而重复补采。成功的那一次交给备库同步完成事件来对账，
    # 看到的就是访客真正读到的那份数据。
    workflows: ["行情快照", "备库同步", "网页发布", "看门狗（停更告警）"]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"     # 每小时两次，与看门狗 :05 错峰
    - cron: "25 22 * * 1-5"     # 收盘后独立兜底（不依赖任何上游）
  workflow_dispatch:
    inputs:
      source:
        description: 触发来源（manual / pg-cron）
        required: false
        default: manual
        type: string
  # 「平台外」独立时钟：Supabase pg_cron 每 20 分钟 POST 一个
  # repository_dispatch（Vault PAT 无 contents:write 时自动降级为
  # workflow_dispatch + source=pg-cron）。安装入口是 heartbeat-setup.yml，
  # 凭据只在 Supabase Vault、明文不进本仓库。2026-11-06 为收敛 egress 把
  # 库内 trade-dispatch / trade-dispatch-market 一并停掉后，调度权 100%
  # 落回 GitHub schedule，这正是「cron 一延迟、整条链全哑」的共模故障来源。
  # 心跳只唤起只读对账、不派发采集，20 分钟一拍、单次约 300 字节，
  # 不会重演 1139 次/10 天、egress 399% 超额的事故。
  repository_dispatch:
    types: [reconcile-tick]
  push:
    branches: [main]
    paths:
      - reconcile_sessions.py
      - reconcile_outputs.py
      - external_heartbeat.py
      - trading_window.py
      - research/exchange_calendar.json
      - watchdog_site_check.py
      - watchdog_checks.py
      - test_reconcile_sessions.py
      - test_reconcile_outputs.py
      - test_external_heartbeat.py
      - .github/workflows/reconcile.yml

concurrency:
  group: trade-reconcile
  cancel-in-progress: true      # 只读幂等；重复触发只保留最新一次

permissions:
  contents: read
  actions: write                # 读运行历史 + 派发补采

jobs:
  reconcile:
    # 行情快照成功时对账延后到「备库同步完成」事件，避免同步在途被误判为
    # 数据缺口；行情快照失败则立即对账并补采，不等任何 cron。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.name != '行情快照' ||
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 对账器离线自检
        run: python3 -m unittest test_reconcile_sessions test_reconcile_outputs test_external_heartbeat
      - name: 平台外心跳存活检查（只告警，不阻断）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 external_heartbeat.py --health
      - name: 场次对账（只读，标准库）
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 reconcile_sessions.py --gate
      - name: 派发缺口补采
        # 三重闸门：数据确实缺失 + 不在冷却/在途 + 同场次未超上限。
        # quotes.yml 的 workflow_dispatch 走 TRADE_FORCE_BUDGET=1，
        # egress freeze 档也不会截断这条关键补采。
        if: steps.check.outputs.dispatch_allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AS_OF: ${{ steps.check.outputs.as_of }}
        run: |
          gh workflow run quotes.yml -f critical=true -f as_of="$AS_OF" || \
            echo "::warning::收盘补采派发失败"
      # 2026-11-11：quotes 有场次对账，但净值/预览没有。ranking 一旦因收盘
      # bar 未结算而失败，输出链就此停住（页面「净值截至」4 天不动），
      # 而所有 quotes 对账都显示「数据已齐」。这里按「预览场次是否落后于
      # 收盘场次」自动派发重算，数据源 settle 后下一拍即补回。
      - name: 展示输出对账（净值 / 预览）
        id: derived
        # 本轮已派发行情补采时跳过：此刻 Turso 仍是旧数据，且两处都会写主库。
        if: steps.check.outputs.dispatch_allowed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 reconcile_outputs.py --gate
      - name: 派发净值 / 排名重算
        if: >-
          steps.derived.outputs.need_recompute == 'true' &&
          steps.derived.outputs.dispatch_allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "输出对账：${{ steps.derived.outputs.reason }}"
          gh workflow run live-strategy.yml || \
            echo "::warning::重算派发失败，下一轮对账重试"
      - name: 收盘结算复核（每日一次）
        if: steps.derived.outputs.need_recompute == 'true' && steps.derived.outputs.phase == 'close'
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.derived.outputs.target_session }}
        run: |
          AS_OF="$(python3 trading_window.py --closing-only | python3 -c 'import json,sys,os; d=json.load(sys.stdin); print(d["as_of"] if d["session"] == os.environ["SESSION"] else "")')"
          [ -n "$AS_OF" ] || exit 0
          export CLOSE_AS_OF="$AS_OF"
          DONE="$(gh run list --workflow=quotes.yml --event workflow_dispatch --limit 30 \
            --json createdAt,displayTitle | python3 -c '
          import sys,json,datetime as dt,os
          gate=dt.datetime.fromisoformat(os.environ["CLOSE_AS_OF"])
          print(sum(1 for r in json.load(sys.stdin)
                    if "backfill-closing" in (r.get("displayTitle") or "")
                    and dt.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) >= gate))
          ')"
          [ "$DONE" = "0" ] || exit 0
          gh workflow run quotes.yml -f critical=true -f as_of="$AS_OF" || \
            echo "::warning::收盘结算复核派发失败"

      # 2026-11-22：把「页面读数新不新鲜、全不全」这套判据也搭进本作业。
      # 动因是共模故障：看门狗声明每小时一次，实测只交付 3~4 次/天（GitHub 免费档
      # scheduled events 是尽力而为，11-22 连 12:05 那一 tick 都没落地），而它自己
      # 也是 schedule 触发的——被兜底者（页面读数）和兜底者（看门狗）踩同一条腿。
      # 本作业有三条互相独立的触发源（workflow_run / 平台外心跳 / 错峰 cron），实测
      # 48~52 次/天，同一份判据搭在这里几乎不花钱：watchdog_site_check 只用标准库、
      # 只读浏览器同源的公开端点，不连主库、不占 Supabase 出口。
      # 口径仍然只有一份：这里不复制判据、也不开单——发现问题就转派看门狗，
      # 开单 / 关单 / 自愈仍归它，否则会出现第二个告警生命周期。
      - name: 页面读数复核（借用本作业的触发源覆盖看门狗的调度盲区）
        id: site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_EVENT: ${{ github.event_name }}
          UPSTREAM_RUN: ${{ github.event.workflow_run.name }}
        run: |
          # `OUT=$(cmd); RC=$?` 在 GitHub 的 bash -e 下，命令替换一非零就触发
          # errexit：明细与下面所有分支全被吞掉，本步骤照样 success。11-23 夜里
          # 页面真停更，这一步 11 次真红无一行输出、也没转派看门狗。
          RC=0; OUT=$(python3 watchdog_site_check.py 2>&1) || RC=$?
          if [ "$RC" = 0 ]; then
            # 成功只留一行：本作业 50 次/天，每次把两条常驻 warning（health 由人工
            # 全量构建才刷新、备库一致性回执只在看门狗作业里落）刷 50 遍，读的人
            # 只会把它们当成背景噪音，真出问题时反而看不见。
            echo "页面读数复核通过（$(printf '%s\n' "$OUT" | grep -Eo 'PROBLEMS=[0-9]+ WARNINGS=[0-9]+' | tail -1)；常驻 warning 明细见看门狗作业）"
            exit 0
          fi
          printf '%s\n' "$OUT"
          # 闸一：本轮如果就是看门狗刚跑完触发的对账，绝不再回派——本作业的
          # workflow_run 触发源里列着看门狗，回派会形成 对账→看门狗→对账 的自激环。
          # 事件字段一律走 env，不插值进 shell（上游运行名是可写出来的字符串）。
          if [ "$TRIGGER_EVENT" = "workflow_run" ] && \
             [ "$UPSTREAM_RUN" = "看门狗（停更告警）" ]; then
            echo "::warning::页面读数复核不通过，但本轮由看门狗自身触发，不再回派（开单归它）"
            exit 0
          fi
          # 闸二：45 分钟冷却。看门狗可能只是被 schedule 挤晚了几分钟而不是没跑；
          # 没有冷却，每个对账 tick 都会派一发，3~4 次/天会变成 50 次/天。
          # 读不到时刻时按「无人核验」处理（继续转派）：反过来判成「刚跑过」就等于把
          # 整个盲区补票押在 gh 可用上，gh 一抖就又没人核验页面读数了。
          AGE_MIN=9999
          PREV=$(gh run list --workflow watchdog.yml --limit 6 --json startedAt,status \
                 --jq '[.[]|select(.status=="completed")][0].startedAt // empty')
          PREV_EPOCH=$(date -u -d "$PREV" +%s 2>/dev/null || true)
          case "$PREV_EPOCH" in
            ''|*[!0-9]*) echo "读不到上一次看门狗的运行时刻（PREV='${PREV}'），不做冷却" ;;
            *) AGE_MIN=$(( ( $(date -u +%s) - PREV_EPOCH ) / 60 )) ;;
          esac
          if [ "$AGE_MIN" -lt 45 ]; then
            echo "::warning::页面读数复核不通过，但看门狗 ${AGE_MIN} 分钟前刚跑过，本轮不回派"
            exit 0
          fi
          echo "::error::页面读数复核不通过（明细见上），转派看门狗按现有口径开单与自愈"
          gh workflow run watchdog.yml -f reason="reconcile 页面读数复核" || \
            echo "::warning::看门狗派发失败，下一轮对账重试"
