name: 整库备份与冻结巡检

# 每日把在线库的完整业务状态落到可校验、可回本地的产物，并复核历史冻结边界。
# 2026-11-07：仓库此前没有任何可执行整库备份，data_lock(962 条)、
# series_pick(847 条)、pg_cron 配置只存在于库中，换项目即全丢。
# 凭据表 data_source_secret 永不进入备份产物。

on:
  schedule:
    - cron: "0 4 * * *"       # UTC 04:00，美股收盘后、采集高峰前
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trade-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 应用库内策略（冻结边界 + 出口流量调度收敛，幂等）
        # 放在预算门禁之前：纯库内 DDL/函数调用，几乎不产生出口流量，
        # 即使预算已耗尽也必须让「停掉重复 pg_cron 调度」生效。
        run: |
          python - <<'PY'
          import db_sources
          from pathlib import Path
          files = ('sql/123_history_freeze_policy.sql',
                   'sql/124_egress_schedule.sql')
          c = db_sources.db(); c.autocommit = True
          try:
              with c.cursor() as cur:
                  for f in files:
                      cur.execute(Path(f).read_text(encoding='utf-8'))
                      print('applied', f)
          finally:
              c.close()
          PY

      - name: 下载上一份归档作为增量基线
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh run list --workflow db-backup.yml --limit 10 \
                 --json databaseId,conclusion \
                 --jq '[.[] | select(.conclusion=="success")][0].databaseId // empty')
          if [ -n "$PREV" ] && [ "$PREV" != "${{ github.run_id }}" ]; then
            mkdir -p .baseline
            if gh run download "$PREV" --name trade-db-backup --dir .baseline; then
              F=$(ls -1 .baseline/*.tar.gz 2>/dev/null | head -1)
              [ -n "$F" ] && echo "path=$F" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "baseline=${PREV:-none}"

      - name: 出口流量预算门禁
        id: egress
        env:
          GH_TOKEN: ${{ github.token }}
          TRADE_FORCE_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python egress_budget.py --workflow "整库备份与冻结巡检" --fast --critical

      - name: 整库逻辑备份（增量复用，排除凭据表）
        if: steps.egress.outputs.allow == 'true'
        run: |
          STAMP=$(date -u +%Y%m%d)
          PREV="${{ steps.baseline.outputs.path }}"
          ARGS=""
          if [ -n "$PREV" ] && [ -f "$PREV" ]; then ARGS="--previous $PREV"; fi
          python db_backup.py --output "output/backups/trade-${STAMP}.tar.gz" $ARGS > backup_manifest.json
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path('backup_manifest.json').read_text())
          assert m['total_tables'] > 0 and m['total_rows'] > 0, 'empty backup'
          assert set(m['excluded_tables']) == {'data_source_secret'}, 'credential table leaked'
          assert all('data_source_secret' not in t for t in m['tables']), 'credential table present'
          print('backup OK: %d tables, %d rows, %d bytes, sha256=%s'
                % (m['total_tables'], m['total_rows'], m['archive_bytes'], m['archive_sha256'][:16]))
          PY

      - name: 备份可读性与完整性复核
        if: steps.egress.outputs.allow == 'true'
        run: |
          EXPECTED=$(python -c "import json;print(json.load(open('backup_manifest.json'))['archive_sha256'])")
          python db_backup.py --verify "$(ls -1 output/backups/*.tar.gz | head -1)" --expected-sha256 "$EXPECTED"

      - name: 历史冻结边界巡检
        run: python verify_frozen_history.py

      - name: 上传备份产物
        if: steps.egress.outputs.allow == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trade-db-backup
          path: output/backups/*.tar.gz
          retention-days: 90
          if-no-files-found: warn
