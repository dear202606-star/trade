name: 行情快照

on:
  schedule:
    # 美股盘中（13:30–21:00 UTC）每 30 分钟，工作日
    - cron: "*/30 13-21 * * 1-5"
    # 北京时间早上补一次收盘价
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - quotes.py
      - site_build.py
      - site_src/**
      - .github/workflows/quotes.yml

permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 抓取行情
        run: python quotes.py

      - name: 构建站点
        run: python site_build.py

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
