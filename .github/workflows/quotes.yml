name: 行情快照
run-name: >-
  行情快照 · ${{ github.event_name == 'workflow_dispatch' && 'backfill-closing' || 'closing' }}

concurrency:
  group: trade-live-quotes
  cancel-in-progress: false

on:
  schedule:
    - cron: "45 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      critical:
        description: 保留兼容的收盘补采参数
        type: choice
        options: ['true', 'false']
        default: 'true'
      as_of:
        description: 补采场次的逻辑时间（ISO 8601）
        type: string

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: 收盘场次门禁
        id: gate
        env:
          AS_OF_INPUT: ${{ github.event.inputs.as_of }}
        run: python3 trading_window.py --closing-only --as-of "$AS_OF_INPUT" --gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 在线报价与失败保护回归
        run: python -m unittest test_live_quotes test_quote_repairs test_quote_snapshot test_market_calendar test_watchdog_checks test_trading_window test_reconcile_sessions test_publish_ui test_intraday_skip
      - name: 检查在线写入凭据
        if: steps.gate.outputs.allow == 'true'
        run: test -n "$SUPABASE_DB_PASSWORD"
      - name: 出口流量预算门禁
        id: egress
        if: steps.gate.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # 2026-11-10：原先只有收盘 cron 带 --critical，看门狗派发的
          # workflow_dispatch 补跑在 freeze 档被拒，自愈链条被截断，
          # 页面数据因此连续 4 天停更。dispatch 与关键 cron 一律放行。
          TRADE_FORCE_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          ARGS=""
          if [ "${{ steps.gate.outputs.critical }}" = "true" ] || \
             [ "${{ github.event.inputs.critical }}" = "true" ]; then
            ARGS="--critical"
          fi
          python egress_budget.py --workflow "行情快照" --fast $ARGS
      - name: 刷新在线行情
        id: refresh
        if: steps.gate.outputs.allow == 'true' && steps.egress.outputs.allow == 'true'
        timeout-minutes: 14
        env:
          AS_OF: ${{ steps.gate.outputs.as_of || github.event.inputs.as_of }}
        run: |
          for attempt in 1 2; do
            if [ -n "$AS_OF" ]; then
              python live_quotes.py --write --closing-only --as-of "$AS_OF" && exit 0
            else
              python live_quotes.py --write --closing-only && exit 0
            fi
            echo "采集第 $attempt 次失败，20 秒后重试"
            sleep 20
          done
          exit 1
      - name: 门禁拒绝时显式留痕
        if: steps.gate.outputs.allow != 'true' || steps.egress.outputs.allow != 'true'
        run: echo "本轮没有写入收盘行情"
