name: 行情快照

concurrency:
  group: trade-pipeline
  cancel-in-progress: false

on:
  schedule:
    # GitHub 定时任务经常延迟/漏触发（实测延迟 3-4.5 小时、平台故障时停摆半天），
    # 所以打散成全天每 2 小时两次（半小时错开），任何一次失败都有下一次兜底。
    - cron: "0 */2 * * *"
    - cron: "30 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - quotes.py
      - equity.py
      - strategy_history.py
      - datafeed.py
      - site_build.py
      - selftest.py
      - runner.py
      - site_src/**
      - .github/workflows/quotes.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取行情
        run: python runner.py quotes.py

      - name: 更新信号（同月增量，秒级）
        continue-on-error: true
        run: python runner.py monthly_pick.py --workers 10

      - name: 计算策略净值
        continue-on-error: true
        run: python runner.py equity.py
      - name: 生成明年预览
        run: python runner.py preview.py

      - name: 生成逐年记录（历史已锁定，不再重算）
        continue-on-error: true
        run: python runner.py strategy_history.py

      - name: 构建站点
        run: python runner.py site_build.py

      - name: 部署前自检
        run: python runner.py selftest.py

      - name: 提交状态日志
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/pipeline_status.json
          # 成分表过期时会自动刷新，把刷新结果提交回去，避免每次重复拉
          if [ -f static/sp500_members.csv ]; then git add static/sp500_members.csv; fi
          if [ -f output/signal_history.json ]; then git add -f output/signal_history.json; fi
          if [ -f output/splits.json ]; then git add -f output/splits.json; fi
          git diff --staged --quiet || git commit -m "chore: 流水线状态 $(date -u +%H:%M)"
          # 站点发布走 Pages 产物，不依赖这次提交；推送失败只告警，不阻断部署
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 失败，第 $i 次重试…"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            sleep 5
          done
          echo "::warning::状态日志未能推送（不影响站点发布）"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
