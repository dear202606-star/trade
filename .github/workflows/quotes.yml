name: 行情快照

on:
  schedule:
    # 盘中：美股 13:30–21:00 UTC，每 30 分钟（= 北京 21:30–05:00）
    - cron: "*/30 13-21 * * 1-5"
    # 收盘快照：22:30 UTC = 北京 06:30（当日最终收盘价）
    - cron: "30 22 * * 1-5"
    # 兜底刷新：11:00 UTC = 北京 19:00（保证 20:00 前一定是最新）
    - cron: "0 11 * * 1-5"
    # 周末补一次
    - cron: "0 2 * * 6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - quotes.py
      - equity.py
      - hedge_backtest.py
      - absolute_backtest.py
      - strategy_history.py
      - datafeed.py
      - site_build.py
      - selftest.py
      - runner.py
      - site_src/**
      - .github/workflows/quotes.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取行情
        run: python runner.py quotes.py

      - name: 计算策略净值
        continue-on-error: true
        run: python runner.py equity.py

      - name: 生成逐年记录
        continue-on-error: true
        run: python runner.py strategy_history.py

      - name: 对冲回测
        continue-on-error: true
        run: python runner.py hedge_backtest.py

      - name: 绝对收益回测
        continue-on-error: true
        run: python runner.py absolute_backtest.py

      - name: 构建站点
        run: python runner.py site_build.py

      - name: 部署前自检
        run: python runner.py selftest.py

      - name: 提交状态日志
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/pipeline_status.json
          git diff --staged --quiet || git commit -m "chore: 流水线状态 $(date -u +%H:%M)"
          git push || true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
