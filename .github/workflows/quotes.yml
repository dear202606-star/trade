name: 行情快照

concurrency:
  group: trade-live-quotes
  cancel-in-progress: false

# 2026-11-07 Egress 收敛：本周期实测行情快照被触发 1139 次/10 天，
# 其中 GitHub schedule 与 pg_cron 的 "*/5 13-21 * * 1-5" 是同一 cron
# 双触发（见 sql/124_egress_schedule.sql，已停掉库内两个 dispatch 作业）。
# 快照改为盘中 30 分钟 + 收盘 1 次；策略是年度持仓 + 日度净值，
# 5 分钟级刷新既不改变结果，又是配额被打穿的直接放大器。
on:
  schedule:
    - cron: "*/30 13-20 * * 1-5"   # 盘中 30 分钟（再由 NYSE 日历门禁精确收窄）
    # 2026-11-10：开盘后 30 分钟是「必须有」的关键一次。美东开盘随 DST 在
    # 13:30 / 14:30 UTC 之间切换，故两条 cron 都列出，由 trading_window
    # 的 opening 任务按已复核日历挑出真正落在开盘后 25~45 分钟的那一条。
    - cron: "0 14 * * 1-5"         # 开盘后 30 分钟（EDT）
    - cron: "0 15 * * 1-5"         # 开盘后 30 分钟（EST）
    - cron: "17 21 * * 1-5"        # 收盘后关键一次
    # 2026-11-08：原 02:17 UTC 补跑 = 北京 10:17，落在非交易时段。
    # 迁入收盘窗口作二次兜底（北京 05:50），保留容错且完全避开北京 6-20 点。
    - cron: "50 21 * * 1-5"        # 收盘兜底
  workflow_dispatch:
    # 看门狗自愈会带 as_of 派发：GitHub 把收盘任务延迟数小时，甚至拖到
    # 次日盘前，此时在线报价仍挂着上一场次收盘价，用逻辑时间即可补回。
    inputs:
      critical:
        description: '关键任务（额度 freeze 档仍放行）'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      as_of:
        description: '补采逻辑时间 ISO 8601（留空=实时）'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - live_quotes.py
      - market_calendar.py
      - trading_window.py
      - research/exchange_calendar.json
      - research/install_exchange_calendar.py
      - quotes.py
      - db_ref.py
      - db_sources.py
      - test_live_quotes.py
      - test_quote_repairs.py
      - watchdog_checks.py
      - egress_budget.py
      - run_guard.py
      - test_watchdog_checks.py
      - test_egress_budget.py
      # 2026-11-05：原白名单漏了实际会跑的 test_quote_snapshot.py /
      # test_market_calendar.py，改这两个文件不触发任何 CI。改为通配。
      - 'test_*.py'
      - 'test_*.mjs'
      - .github/workflows/quotes.yml

permissions:
  contents: read
  actions: write       # 读运行记录 + 采集成功后派发备库同步（gh workflow run）

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 500+ 只标的分批抓取 + 缺失报价的独立佐证修复，实测 4 分钟会被 job
    # 级超时硬砍（2026-11-10 两次补采都在采集途中被 canceled）。留足预算，
    # 并允许一次自动重试，避免单次网络抖动就丢掉一整天的收盘数据。
    timeout-minutes: 20
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      # 2026-11-08：GitHub cron 只认「周一到周五」，认不出 NYSE 休市日。
      # 门禁用已复核的 XNYS 日历在 pip install 之前秒退：感恩节、Good Friday、
      # 独立日、圣诞等全天不连库；周末与北京 6-20 点同样不采集。
      # 纯标准库、只读、失败一律 fail-open；手动 / push 触发不受约束。
      - name: 交易时段门禁（NYSE 已复核日历）
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          AS_OF_INPUT: ${{ github.event.inputs.as_of }}
        run: |
          EXTRA=""
          GATE_EVENT="$EVENT_NAME"
          case "$SCHEDULE" in
            "17 21 * * 1-5"|"50 21 * * 1-5") TASK=closing; EXTRA="--late-ok" ;;
            "0 14 * * 1-5"|"0 15 * * 1-5") TASK=opening ;;
            *) TASK=intraday ;;
          esac
          # 手动派发分两种，不能一律无条件放行：
          #   · 带 as_of = 看门狗自愈的延迟补跑，逻辑时间由
          #     live_quotes.logical_time 严格校验（20h 上限 / 日历场次 / 收盘窗口），
          #     按 closing --late-ok 放行；
          #   · 不带 as_of = 人工实时验证，必须按 intraday 日历窗口裁决。
          #     实测盘前新浪把 gb_spy 的前收价写成现价、涨跌额置 0，三字段
          #     自洽但语义是假的；若放行会把整轮假报价写进生产并污染净值。
          #     需要非交易时段强制验证请用 TRADE_FORCE_COLLECT=1。
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$AS_OF_INPUT" ]; then
              TASK=closing; EXTRA="--late-ok"
            else
              TASK=intraday; EXTRA=""
              GATE_EVENT="schedule"   # 借日历裁决，不再无条件放行
            fi
          fi
          EVENT_NAME="$GATE_EVENT" python3 trading_window.py --task "$TASK" $EXTRA --gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 在线报价与失败保护回归
        run: python -m unittest test_live_quotes test_quote_repairs test_quote_snapshot test_market_calendar test_watchdog_checks test_trading_window
      - name: 检查在线写入凭据
        if: steps.gate.outputs.allow == 'true'
        run: test -n "$SUPABASE_DB_PASSWORD"
      - name: 出口流量预算门禁
        id: egress
        if: steps.gate.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # 2026-11-10：原先只有收盘 cron 带 --critical，看门狗派发的
          # workflow_dispatch 补跑在 freeze 档被拒，自愈链条被截断，
          # 页面数据因此连续 4 天停更。dispatch 与关键 cron 一律放行。
          TRADE_FORCE_BUDGET: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          ARGS=""
          if [ "${{ steps.gate.outputs.critical }}" = "true" ] || \
             [ "${{ github.event.inputs.critical }}" = "true" ]; then
            ARGS="--critical"
          fi
          python egress_budget.py --workflow "行情快照" --fast $ARGS
      - name: 刷新在线行情
        id: refresh
        if: steps.gate.outputs.allow == 'true' && steps.egress.outputs.allow == 'true'
        timeout-minutes: 14
        env:
          AS_OF: ${{ steps.gate.outputs.as_of || github.event.inputs.as_of }}
        run: |
          for attempt in 1 2; do
            if [ -n "$AS_OF" ]; then
              python live_quotes.py --write --as-of "$AS_OF" && exit 0
            else
              python live_quotes.py --write && exit 0
            fi
            echo "采集第 $attempt 次失败，20 秒后重试"
            sleep 20
          done
          exit 1
      - name: 关键采集成功后立即同步备库
        # 原 db-sync 收盘 cron 是 21:10 UTC，比 21:17 的采集还早，
        # 当天收盘数据要等到第二天才进 Turso。采集成功后直接派发，
        # 把「采集 → 同步」变成严格顺序，定时同步仍保留作兜底。
        # 开盘后 30 分钟那次同样立刻推 Turso：访客读的就是 Turso，
        # 不能让「开盘一次」只在主库落地、页面要等 30 分钟后才看到。
        # 只有收盘任务才唤醒 Neon（免费额度每工作日仅一次）。
        if: >-
          success() && steps.refresh.outcome == 'success' &&
          (steps.gate.outputs.task == 'closing' || steps.gate.outputs.task == 'opening')
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ steps.gate.outputs.task }}
        run: |
          if [ "$TASK" = "closing" ]; then
            gh workflow run db-sync.yml -f targets=turso,neon || true
          else
            gh workflow run db-sync.yml -f targets=turso || true
          fi
