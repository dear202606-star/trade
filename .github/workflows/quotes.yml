name: 行情快照

on:
  schedule:
    # 盘中：美股 13:30–21:00 UTC，每 30 分钟（= 北京 21:30–05:00）
    - cron: "*/30 13-21 * * 1-5"
    # 收盘快照：22:30 UTC = 北京 06:30（拿到当日最终收盘价）
    - cron: "30 22 * * 1-5"
    # 兜底刷新：11:00 UTC = 北京 19:00（保证 20:00 前一定是最新）
    - cron: "0 11 * * 1-5"
    # 周末补一次，避免周一开盘前数据过旧
    - cron: "0 2 * * 6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - quotes.py
      - site_build.py
      - site_src/**
      - datafeed.py
      - selftest.py
      - strategy_history.py
      - equity.py
      - .github/workflows/quotes.yml

permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 抓取行情
        run: python quotes.py

      - name: 计算策略净值
        continue-on-error: true
        run: python equity.py

      - name: 生成逐年记录
        continue-on-error: true
        run: python strategy_history.py

      - name: 构建站点
        run: python site_build.py

      - name: 部署前自检（数据不全就不部署）
        run: python selftest.py

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
