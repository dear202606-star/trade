name: 行情快照

concurrency:
  group: trade-live-quotes
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
    - cron: "17 2 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - live_quotes.py
      - market_calendar.py
      - quotes.py
      - db_ref.py
      - db_sources.py
      - test_live_quotes.py
      - test_quote_repairs.py
      - watchdog_checks.py
      - test_watchdog_checks.py
      # 2026-11-05：原白名单漏了实际会跑的 test_quote_snapshot.py /
      # test_market_calendar.py，改这两个文件不触发任何 CI。改为通配。
      - 'test_*.py'
      - 'test_*.mjs'
      - .github/workflows/quotes.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 在线报价与失败保护回归
        run: python -m unittest test_live_quotes test_quote_repairs test_quote_snapshot test_market_calendar test_watchdog_checks
      - name: 检查在线写入凭据
        run: test -n "$SUPABASE_DB_PASSWORD"
      - name: 刷新在线行情
        run: python live_quotes.py --write
