name: 工程回归

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - '**.py'
      - 'static/verified_ticker_renames.json'
      - '.github/workflows/regression.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 数据、事件、证券身份和流动性回归
        run: python -m unittest test_data_pipeline test_nominal_prices test_holding_consideration test_holding_paths test_eastmoney_nominal test_security_membership test_liquidity_prices test_planned_liquidity test_quote_snapshot test_watchdog_checks
