name: 看门狗（停更告警）

# 覆盖「压根没跑」这个盲区：定时检查页面真正读到的数据是否新鲜完整，
# 超时就在 Issue 里喊，不再依赖「失败才告警」。
#
# 2026-11-07：改为校验 data/snapshot.json（CI 从在线库直连导出的同源镜像），
# 不再检查已下线的 health.json / b/strategy_history.json / quality.json（恒 404），
# 也不再经 PostgREST 读在线视图（egress 超额时恒 402）。这样网关故障时
# 看门狗仍能准确判断「页面数据是否可用」，而不是把基础设施告警误报成数据停更。

on:
  schedule:
    - cron: "5 * * * *"      # 每小时一次
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 实时层健康（5 分钟级）
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pip install psycopg2-binary requests
          python realtime_check.py

      - name: 检查页面数据源与部署新鲜度
        if: always()
        id: check
        run: python watchdog_site_check.py

      - name: 自动自愈（仅白名单幂等动作，带冷却）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python selfheal.py --problems problems.txt

      - name: 开 Issue 告警
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="看门狗：页面数据不新鲜或不完整"
          BODY="$(date -u '+%Y-%m-%d %H:%M UTC') 检查发现：
          $(cat problems.txt 2>/dev/null || echo '（无明细）')

          可能原因：数据管线停跑 / 镜像发布失败 / 采集失败 / 数据库口令未配置。"
          EXIST=$(gh issue list --label watchdog --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label watchdog || \
            gh issue create --title "$TITLE" --body "$BODY"
          fi
