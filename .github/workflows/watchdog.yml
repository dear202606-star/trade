name: 看门狗（停更告警）

# 覆盖「压根没跑」这个盲区：定时检查页面真正读到的数据是否新鲜完整，
# 超时就在 Issue 里喊，不再依赖「失败才告警」。
#
# 2026-11-08：页面取消本地文件镜像，主库 402 时自动切 Turso 在线备库。
# 看门狗改为「三层校验」：① 直接读浏览器实际使用的 Turso 数据；
# ② verify_replication.py 比对 Turso / Neon 的 key 数与 payload 哈希；
# ③ realtime_check.py 直连主库的实时报价回执。三者都不经 PostgREST，
# 因此 egress 超额时限服不会让监控失效，也不会把网关告警误报成数据停更。

on:
  schedule:
    - cron: "5 * * * *"      # 声明每小时一次；实测交付只有 3~4 次/天（见下方盲区步骤）
    # 收盘后 90 分钟是最关键的一刻（snapshot_problems 的场次判据靠它当场发现停更），
    # 而随机挤掉的定时很可能正好错过这个窗口。22:20 UTC = 美东 17:20（EST 收盘后
    # 140 分钟 / EDT 收盘后 200 分钟），单独钉一次，让最要紧的窗口多一次机会。
    - cron: "20 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 实时层健康（5 分钟级）
        id: realtime
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # realtime_check -> live_quotes -> quotes 依赖 pandas/openpyxl，
          # 只装 psycopg2+requests 会在 import 阶段 ModuleNotFoundError 崩溃，
          # 且写不出回执，让页面数据检查被误判为「监控缺失」。
          pip install -r requirements.txt
          python realtime_check.py

      - name: 三库一致性与端点健康（Turso + Neon）
        if: always()
        id: replication
        env:
          TURSO_HTTP_URL: ${{ secrets.TURSO_HTTP_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEON_DSN: ${{ secrets.NEON_DSN }}
        run: python verify_replication.py

      - name: 检查页面数据源与部署新鲜度
        if: always()
        id: check
        run: python watchdog_site_check.py

      - name: 监控盲区自陈（看门狗自己多久没跑）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 这个作业存在的理由是「覆盖压根没跑这个盲区」，可它自己也是被调度的：
          # 实测 cron 声明每小时，GitHub 队列挤掉后只交付 3~4 次/天（2026-11-15~22
          # 每天 2~4 条运行记录）。盲区本身不是页面数据故障，所以绝不判失败——
          # 按当前交付率那样做只会得到恒红；但超过半天无人核验必须留得下名字。
          PREV=$(gh run list --workflow watchdog.yml --limit 8 --json createdAt,status \
                 --jq '[.[]|select(.status=="completed")][0].createdAt // empty')
          if [ -z "$PREV" ]; then
            echo "::warning::读不到上一次看门狗运行记录，监控盲区无法评估"
            exit 0
          fi
          GAP_H=$(( ( $(date -u +%s) - $(date -u -d "$PREV" +%s) ) / 3600 ))
          echo "距上一次看门狗运行 ${GAP_H} 小时（cron 声明：每小时）"
          if [ "$GAP_H" -gt 8 ]; then
            echo "::warning::看门狗已 ${GAP_H} 小时未运行，期间页面读数无人核验（场次停更由 场次对账 / 在线净值 兜住）"
          fi

      - name: 自动自愈（仅白名单幂等动作，带冷却）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python selfheal.py --problems problems.txt

      - name: 开 Issue 告警
        # 只在「页面数据源检查确实发现问题」时开数据告警。原先 if: failure()
        # 是作业级判断：实时层任一步骤（如依赖安装）失败也会开一个
        # 「页面数据不新鲜」的 Issue，即使 PROBLEMS=0，属误报。
        if: always() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="看门狗：页面数据不新鲜或不完整"
          BODY="$(date -u '+%Y-%m-%d %H:%M UTC') 检查发现：
          $(cat problems.txt 2>/dev/null || echo '（无明细）')

          可能原因：数据管线停跑 / 镜像发布失败 / 采集失败 / 数据库口令未配置。
          实时层健康检查：${{ steps.realtime.outcome }}"
          # 去重按标题查，并且拒绝降级成「无标签建单」。原先查的是
          # --label watchdog，而仓库里根本没有这个标签：create 的
          # `|| gh issue create`（不带标签）成功建单，查询却永远为空，
          # 于是每轮巡检都新开一张——2026-11 累积了 12 张同名未关单。
          gh label list --limit 300 --json name --jq '.[].name' | grep -qx data-alert || {
            echo "::error::仓库缺少 data-alert 标签，告警无法去重，拒绝建未标签单"; exit 1; }
          EXIST=$(gh issue list --state open --label data-alert --limit 100 --json number,title \
                  --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1 || true)
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label data-alert
          fi

      # 告警必须反映当前状态：只开不关，就等于把一次已修好的故障永久钉成「在册」。
      # 实测 2026-11-22 11:02 那轮 PROBLEMS=0（作业 success），而 #48 仍 OPEN，
      # 读的人只能靠翻注释才知道它其实已经不成立了。
      # 关单后去重锚点消失，下次真故障会重新开一张——这正是「开着的单 = 当前有问题」
      # 想要的语义，2026-11-21「合并到一张」决策合并的是重复单，不是一张贴死的封条。
      - name: 检查通过则关闭在册告警
        if: always() && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="看门狗：页面数据不新鲜或不完整"
          OPEN=$(gh issue list --state open --label data-alert --limit 100 --json number,title \
                 --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1 || true)
          if [ -z "$OPEN" ]; then
            echo "无在册告警需关闭"
          else
            gh issue comment "$OPEN" --body "$(date -u '+%Y-%m-%d %H:%M UTC') 本轮页面数据源检查通过（PROBLEMS=0），按当前状态关闭本单。后续若再次失败会重新开单或追加同名单。"
            gh issue close "$OPEN"
          fi
