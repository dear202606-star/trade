name: 看门狗（停更告警）

# 覆盖「压根没跑」这个盲区：定时检查页面真正读到的数据是否新鲜完整，
# 超时就在 Issue 里喊，不再依赖「失败才告警」。
#
# 2026-11-08：页面取消本地文件镜像，主库 402 时自动切 Turso 在线备库。
# 看门狗改为「三层校验」：① 直接读浏览器实际使用的 Turso 数据；
# ② verify_replication.py 比对 Turso / Neon 的 key 数与 payload 哈希；
# ③ realtime_check.py 直连主库的实时报价回执。三者都不经 PostgREST，
# 因此 egress 超额时限服不会让监控失效，也不会把网关告警误报成数据停更。

on:
  schedule:
    - cron: "5 * * * *"      # 每小时一次
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 实时层健康（5 分钟级）
        id: realtime
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # realtime_check -> live_quotes -> quotes 依赖 pandas/openpyxl，
          # 只装 psycopg2+requests 会在 import 阶段 ModuleNotFoundError 崩溃，
          # 且写不出回执，让页面数据检查被误判为「监控缺失」。
          pip install -r requirements.txt
          python realtime_check.py

      - name: 三库一致性与端点健康（Turso + Neon）
        if: always()
        id: replication
        env:
          TURSO_HTTP_URL: ${{ secrets.TURSO_HTTP_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEON_DSN: ${{ secrets.NEON_DSN }}
        run: python verify_replication.py

      - name: 检查页面数据源与部署新鲜度
        if: always()
        id: check
        run: python watchdog_site_check.py

      - name: 自动自愈（仅白名单幂等动作，带冷却）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python selfheal.py --problems problems.txt

      - name: 开 Issue 告警
        # 只在「页面数据源检查确实发现问题」时开数据告警。原先 if: failure()
        # 是作业级判断：实时层任一步骤（如依赖安装）失败也会开一个
        # 「页面数据不新鲜」的 Issue，即使 PROBLEMS=0，属误报。
        if: always() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="看门狗：页面数据不新鲜或不完整"
          BODY="$(date -u '+%Y-%m-%d %H:%M UTC') 检查发现：
          $(cat problems.txt 2>/dev/null || echo '（无明细）')

          可能原因：数据管线停跑 / 镜像发布失败 / 采集失败 / 数据库口令未配置。
          实时层健康检查：${{ steps.realtime.outcome }}"
          EXIST=$(gh issue list --label watchdog --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label watchdog || \
            gh issue create --title "$TITLE" --body "$BODY"
          fi
