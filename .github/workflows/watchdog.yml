name: 看门狗（停更告警）

# 覆盖「压根没跑」这个盲区：定时检查线上数据新鲜度与关键表活跃度，
# 超时就在 Issue 里喊，不再依赖「失败才告警」。
# 线上产物只读检查；实时层数据库检查使用 SUPABASE_DB_PASSWORD。

on:
  schedule:
    - cron: "5 * * * *"      # 每小时一次
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 实时层健康（5 分钟级）
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pip install psycopg2-binary requests
          python realtime_check.py

      - name: 检查线上健康与部署新鲜度
        if: always()
        id: check
        run: |
          python - <<'PY'
          import json, time, urllib.request, datetime as dt
          from watchdog_checks import quality_problems, history_problems, published_dependency_problems
          problems = []
          base = "https://dear202606-star.github.io/trade/data/"
          # 1) health.json
          try:
              h = json.load(urllib.request.urlopen(base + "health.json?nocache=" + str(time.time()), timeout=20))
              print("health:", h)
              # Static quote checks were superseded by the online check above.
              issues = h.get("issues")
              if not isinstance(issues, list) or any(not isinstance(x, str) for x in issues):
                  raise ValueError("health.issues 无效")
              problems.extend(x for x in issues if not x.startswith("行情"))
              if h.get("status") not in ("ok", "degraded"):
                  problems.append("health.status=%s" % h.get("status"))
          except Exception as e:
              problems.append("health.json 读取失败: %s" % str(e)[:60])
          # 2) 已核验历史允许冻结，仅检查年度连续性及新增年度。
          try:
              req = urllib.request.Request(base + "b/strategy_history.json?nocache=" + str(time.time()))
              r = urllib.request.urlopen(req, timeout=20)
              d = json.load(r)
              problems.extend(history_problems(d, dt.datetime.now(dt.timezone.utc)))
          except Exception as e:
              problems.append("产物读取失败: %s" % str(e)[:60])
          # 3) 校验实际发布的质量报告，缺失证据也必须告警
          try:
              q = json.load(urllib.request.urlopen(base + "quality.json?nocache=" + str(time.time()), timeout=20))
              problems.extend(quality_problems(q))
          except Exception as e:
              problems.append("线上质量报告读取或校验失败: %s" % str(e)[:100])
          # 行情独立成功时，仍需检查收益基准与预览是否推进。
          try:
              cfg = json.load(urllib.request.urlopen(base + "cloud.json", timeout=20))
              req = urllib.request.Request(cfg['url'] + '/rest/v1/live_quote_snapshot?singleton=eq.true&select=payload', headers={'apikey':cfg['key']})
              quotes = json.load(urllib.request.urlopen(req, timeout=20))[0]['payload']
              for prefix in ('', 'b/'):
                  try:
                      def artifact(name):
                          variant = 'B' if prefix else 'A'
                          req = urllib.request.Request(cfg['url'] + '/rest/v1/v_live_strategy_results?variant=eq.' + variant + '&kind=eq.' + name + '&select=payload', headers={'apikey':cfg['key']})
                          rows = json.load(urllib.request.urlopen(req, timeout=20))
                          if len(rows) != 1: raise ValueError('在线计算结果缺失或不唯一')
                          return rows[0]['payload']
                      problems.extend(prefix + p for p in published_dependency_problems(artifact('equity'), artifact('preview'), quotes))
                  except Exception as e:
                      problems.append(prefix + '计算依赖读取或校验失败: ' + str(e)[:100])
          except Exception as e:
              problems.append('在线计算依赖检查失败: ' + str(e)[:100])
          try:
              with open("output/realtime_check.json", encoding="utf-8") as f:
                  problems.extend(json.load(f)["problems"])
          except Exception as e:
              problems.append("在线报价监控回执缺失: %s" % str(e)[:100])
          with open("problems.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(problems))
          print("PROBLEMS=%d" % len(problems))
          for p in problems:
              print(" -", p)
          raise SystemExit(1 if problems else 0)
          PY

      - name: 开 Issue 告警
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="看门狗：线上数据不新鲜"
          BODY="$(date -u '+%Y-%m-%d %H:%M UTC') 检查发现：
          $(cat problems.txt 2>/dev/null || echo '（无明细）')

          可能原因：工作流未运行 / 部署被跳过 / 采集失败 / 数据库口令未配置。"
          EXIST=$(gh issue list --label watchdog --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label watchdog || \
            gh issue create --title "$TITLE" --body "$BODY"
          fi
