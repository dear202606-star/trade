name: 回填历史行情

# 需要仓库 Secret：ALPHAVANTAGE_API_KEY
#
# 2026-11-22 停掉定时，只留手动派发（用户口径）。三条实测理由：
#   · fetch_prices.py:41 用同一把 ALPHAVANTAGE_API_KEY 直接打 22 次，且不看
#     relay_source.py:397 的当日额度账本，与 daily-backfill 抢同一份 25 次/天；
#   · 近 6 次运行全部失败在「回填一批」，一次都没走到验收；
#   · 它唯一的产物 static/prices/ 从未产生过提交（git log --all --grep=回填复权行情
#     为空，本机两个目录也各 0 个文件），下游只剩审计脚本在读。
# 这条链（fetch_prices → static/prices → build_unified → static/prices_unified）
# 是离线复现/基线载入用的，需要时手动派发；策略与验收读的是库内 series_selected，
# 不依赖这里的产物。

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "本次回填只数"
        required: false
        default: "22"

concurrency:
  group: trade-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -q pandas requests lxml

      - name: 回填一批
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: python fetch_prices.py --limit "${LIMIT:-22}"

      - name: 写入数据库口令
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p output
          printf '%s' "$SUPABASE_DB_PASSWORD" > output/_supabase_dbpass.txt

      - name: 数据质量验收
        id: qa
        # 2026-11-21：去掉 continue-on-error。验收已改读库内 series_selected，
        # 是真的会判出结果的门禁；daily-backfill.yml 在 2026-11-07 就写过
        # 「质量门禁不得静默降级」，这里留着兜底等于同一道检查一处阻断一处吞掉。
        run: python validate_prices.py

      - name: 提交行情快照
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/prices static/prices_manifest.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无新增行情"
          else
            N=$(git diff --staged --name-only | wc -l)
            git commit -m "chore: 回填复权行情 $(date -u +%Y-%m-%d)（+${N} 文件）"
            git push || echo "::warning::行情提交失败"
          fi

      - name: 覆盖率进度
        run: |
          python - <<'PY'
          import json, os
          p = "static/prices_manifest.json"
          if os.path.exists(p):
              d = json.load(open(p, encoding="utf-8"))
              print("覆盖率 %d/%d（%.0f%%）" % (d["symbols"], d["expected"],
                    100.0 * d["symbols"] / max(1, d["expected"])))
          PY
