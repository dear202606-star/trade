<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行动计划 · LEADER QUANT</title>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/app.js"></script>
</head><body>
<script>DSH.boot();</script>
<div class="wrap">

  <div class="head">
    <div class="eyebrow">Action Plan</div>
    <h1>要下的单</h1>
    <p>按你的实际持仓算出每一笔：买哪只、几股、多少钱。</p>
  </div>

  <div class="hero fade-in">
    <div class="eyebrow" style="margin-bottom:12px">本月动作</div>
    <h2 id="verdict">—</h2>
    <p class="lead" id="verdictSub"></p>
  </div>

  <div style="margin-top:34px">
    <div class="label" style="font-size:12px">执行清单</div>
    <div class="grid" id="orders" style="gap:10px"></div>
  </div>

  <div style="margin-top:34px" id="stepsBox">
    <div class="label" style="font-size:12px">操作顺序</div>
    <div class="card" style="padding:20px 24px">
      <ol style="margin:0;padding-left:20px;line-height:2.1;color:var(--txt-2);font-size:14px">
        <li>先卖出不在名单里的持仓，回笼现金</li>
        <li>再买入股数不足的标的，金额从大到小</li>
        <li>同一天做完，别拖到第二天</li>
        <li>成交后回「我的持仓」按实际成交价更新</li>
        <li>本月之后不再操作，等下个月或 12 月末换仓</li>
      </ol>
    </div>
  </div>

  <div class="foot">结论由规则自动生成，不构成投资建议。下单前请自行确认价格与可用资金。</div>
</div>

<script>
const $ = (id) => document.getElementById(id);

(async function () {
  const sig = await DSH.json('signal', null);
  const q = await DSH.json('quotes', { quotes: {}, fx: 7.1 });
  const quotes = q.quotes || {};
  const pf = DSH.load();

  if (!sig) { $('verdict').textContent = '暂无信号数据'; return; }

  const off = sig.official || sig.picks || [];
  const exp = sig.exposure;
  const isDec = (sig.month || '').endsWith('-12');
  const cap = pf.capital || 0;
  const sleeve = cap * 0.30 * exp;
  const cur = pf.cur || 'USD';

  let verdict, lead;
  if (!cap || !pf.rows.length) {
    verdict = '先录入持仓';
    lead = '打开「我的持仓」填入总资金和买入记录，这里会自动算出每笔的股数。';
  } else if (isDec) {
    verdict = '12 月末换仓';
    lead = '按最新前 3 名重建组合，卖出不在名单的持仓。';
  } else if (exp < 1) {
    verdict = '仓位减半';
    lead = 'SPY ' + sig.spy.toFixed(0) + ' 跌破 10 月均线 ' + sig.ma.toFixed(0) + '，把持仓减到 50%。';
  } else {
    verdict = '本月无需换仓';
    lead = '持有 ' + off.map((p) => p.ticker).join(' / ') + ' 到 12 月末。下面是权重与目标的偏离。';
  }
  $('verdict').textContent = verdict;
  $('verdictSub').textContent = lead;

  if (!cap || !pf.rows.length) {
    $('orders').innerHTML = '<div class="card" style="text-align:center;padding:40px 20px">' +
      '<a class="btn primary" href="portfolio.html">去录入持仓 →</a></div>';
    $('stepsBox').classList.add('hidden');
    return;
  }

  const held = {};
  pf.rows.forEach((r) => { held[r.ticker] = (held[r.ticker] || 0) + r.shares; });

  const items = [];
  off.forEach((p) => {
    const price = (quotes[p.ticker] || {}).p || 0;
    if (!price) return;
    let targetSh = (sleeve * p.weight) / price;
    targetSh = Math.min(targetSh, (cap * 0.10) / price);
    const have = held[p.ticker] || 0;
    delete held[p.ticker];
    items.push({ side: targetSh - have, ticker: p.ticker, name: p.name,
      price, have, targetSh, amt: Math.abs(targetSh - have) * price });
  });
  Object.keys(held).forEach((t) => {
    if (held[t] <= 0) return;
    const price = (quotes[t] || {}).p || 0;
    items.push({ side: -held[t], ticker: t, name: '不在本期名单', price,
      have: held[t], targetSh: 0, amt: held[t] * price });
  });

  const real = items.filter((x) => x.price && x.amt > Math.max(100, sleeve * 0.005));
  const flat = items.filter((x) => real.indexOf(x) < 0);

  const card = (x) => {
    const buy = x.side > 0;
    const qty = Math.abs(x.side);
    return '<div class="action">' +
      '<span class="tag ' + (buy ? 'buy' : 'sell') + '">' + (buy ? '买入' : '卖出') + '</span>' +
      '<div style="min-width:92px"><div style="font-weight:800;font-size:15px">' + DSH.esc(x.ticker) + '</div>' +
        '<div style="font-size:11.5px;color:var(--txt-3);margin-top:2px">' + DSH.esc(x.name || '') + '</div></div>' +
      '<div class="grow" style="text-align:right"><div class="num" style="font-size:16px">' +
        qty.toFixed(qty < 10 ? 2 : 0) + ' 股</div>' +
        '<div class="sub" style="margin-top:2px">@ ' + x.price.toFixed(2) + '</div></div>' +
      '<div style="text-align:right;min-width:110px"><div class="num" style="font-size:16px;color:' +
        (buy ? 'var(--green)' : 'var(--red)') + '">' + (buy ? '' : '−') + DSH.money(x.amt, cur) + '</div>' +
        '<div class="sub" style="margin-top:2px">' + (buy ? '需要资金' : '回笼现金') + '</div></div></div>';
  };

  let html = real.map(card).join('');
  if (flat.length && real.length) {
    html += '<div class="tip" style="margin-top:6px">另外 ' + flat.length + ' 只已在目标附近，无需调整：' +
      flat.map((x) => DSH.esc(x.ticker)).join('、') + '</div>';
  }
  if (!real.length) {
    html = '<div class="tip ok">持仓已在目标权重附近，本月不需要下单。</div>';
  }

  const need = real.filter((x) => x.side > 0).reduce((a, x) => a + x.amt, 0);
  const free = real.filter((x) => x.side < 0).reduce((a, x) => a + x.amt, 0);
  if (real.length) {
    html += '<div class="sub" style="margin-top:6px;font-size:13px">' +
      (need ? '需要买入 ' + DSH.money(need, cur) : '') +
      (need && free ? ' ｜ ' : '') +
      (free ? '卖出回笼 ' + DSH.money(free, cur) : '') +
      ' ｜ 策略总仓位 ' + DSH.money(sleeve, cur) + '（总资金的 ' + (exp * 30).toFixed(0) + '%）</div>';
  }
  $('orders').innerHTML = html;
})();
</script>
</body></html>
