<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080A0F">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>LEADER QUANT</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/page.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo"><span class="en">LEADER<i>·</i>QUANT</span></div>
    <div class="tick">
      <span id="tickPx">—</span>
      <span id="tickChg" class="sub"></span>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ① 今天该做什么 -->
  <section class="card hero">
    <div class="label">今天该做什么</div>
    <h1 class="verdict" id="verdict">—</h1>
    <div class="sub" id="verdictSub"></div>

    <div class="now-grid">
      <div class="cell">
        <div class="label" id="todayLabel">今日</div>
        <div class="num num-lg" id="todayPct">—</div>
        <div class="sub" id="todayAmt"></div>
      </div>
      <div class="cell">
        <div class="label">大盘开关</div>
        <div class="num num-md" id="switchTxt">—</div>
        <div class="sub" id="switchSub"></div>
      </div>
    </div>
  </section>

  <!-- ② 当期策略累计表现 -->
  <section class="card">
    <div class="row-split">
      <h2 class="card-title" id="yearTitle">当期策略收益</h2>
    </div>
    <div class="num num-xl" id="yearRet">—</div>
    <div class="sub" id="yearVs"></div>
    <div id="yearSpark" class="spark-box"></div>

    <div class="amt-row">
      <span class="label" style="margin:0">本金</span>
      <div class="pills" id="amtPills">
        <button class="pill-btn" data-amt="10000">1 万</button>
        <button class="pill-btn on" data-amt="100000">10 万</button>
        <button class="pill-btn" data-amt="1000000">100 万</button>
      </div>
    </div>

    <div class="grid g4 mini">
      <div class="card flat"><div class="label">总市值</div><div class="num num-md" id="tMv">—</div></div>
      <div class="card flat"><div class="label">累计盈亏</div><div class="num num-md" id="tPnl">—</div></div>
      <div class="card flat"><div class="label">建仓成本</div><div class="num num-md" id="tCost">—</div></div>
      <div class="card flat"><div class="label">仓位</div><div class="num num-md" id="tExp">—</div></div>
    </div>
  </section>

  <!-- ③ 持仓 -->
  <section class="card flat">
    <div class="row-split">
      <h2 class="card-title" id="posTitle">持仓</h2>
    </div>
    <div class="pr">
      <div class="pr-head">
        <div>代码</div><div class="r">权重</div><div class="r">建仓价</div>
        <div class="r">现价</div><div class="r">涨跌</div><div class="r">市值</div><div class="r">盈亏</div>
      </div>
      <div id="posRows"></div>
    </div>
    <div class="card-foot right" id="posMeta"></div>
  </section>


  <!-- 明年预览：年初至今涨幅前 3 -->
  <section class="card flat">
    <div class="row-split">
      <h2 class="card-title" id="nextYearTitle">明年可能持仓</h2>
    </div>
    <div id="previewRows" class="pv-list"></div>
    <div class="card-foot right" id="previewNote"></div>
  </section>

  <!-- ⑤ 总体策略至今表现 -->
  <section class="card">
    <div class="row-split">
      <h2 class="card-title">全周期累计收益</h2>
      <div class="sub" id="allRange"></div>
    </div>
    <div class="num num-xl" id="bTotal">—</div>
    <div class="grid g4 mini" style="margin-top:16px">
      <div class="card flat"><div class="label">年化</div><div class="num num-md" id="bCagr">—</div></div>
      <div class="card flat"><div class="label">最大回撤</div><div class="num num-md" id="bMdd">—</div></div>
      <div class="card flat"><div class="label">胜率</div><div class="num num-md" id="bWin">—</div></div>
      <div class="card flat"><div class="label">同期标普</div><div class="num num-md" id="bBench">—</div></div>
    </div>
    <div id="allChart" class="chart-box"></div>
    <div class="legend"><span><i class="dot gold"></i>策略</span><span><i class="dot grey"></i>标普 500</span></div>
  </section>

  <!-- ⑥ 历史与回测 -->
  <section class="card flat">
    <div class="row-split">
      <h2 class="card-title">全周期逐年明细</h2>
    </div>
    <div class="yr">
      <div class="yr-head">
        <div>持有年度</div><div>持仓（上一年 12 月选出）</div><div class="r">收益</div><div class="r">回撤</div>
      </div>
      <div id="yearRows"></div>
    </div>
    <div class="card-foot right">上一年 12 月末选出 · 当年持有 ｜ 右列：收益 / 回撤</div>
  </section>

</main>

<footer class="foot">
  <div id="footStamp">—</div>
  <div>仅供研究，不构成投资建议</div>
</footer>

<script src="assets/app.js"></script>
<script src="assets/page.js"></script>
</body>
</html>
