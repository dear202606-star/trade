<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f8f6"><link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>LEADER QUANT · 趋势与纪律</title>
<link rel="stylesheet" href="assets/dashboard.css?v=5">
</head>
<body>
<a class="skip-link" href="#overview">跳转到投资总览</a>
<header class="top"><div class="top-in">
<a class="logo" href="./" aria-label="Leader Quant 首页">LEADER<span> / </span>QUANT<span class="brand-dot"></span></a>
<nav class="section-nav" aria-label="页面导航"><a href="#overview" class="active">总览</a><a href="#positions">持仓</a><a href="#annual">历年表现</a></nav>
<div class="tick" aria-label="标普500行情"><span class="market-dot"></span><span id="tickPx">SPY —</span><span id="tickChg">—</span><span class="tick-updated" id="tickUpdated"></span></div>
</div></header>
<main class="wrap">
<div class="page-heading"><div><h1>策略总览</h1></div>
<nav class="vtabs" id="vtabs" aria-label="选择策略口径"><button class="vtab on" data-variant="B" aria-pressed="true">全年成分</button><button class="vtab" data-variant="A" aria-pressed="false">时点成分</button></nav></div>
<div class="dashboard-grid">
<section class="panel signal hero" aria-labelledby="verdict">
<div class="label">本期策略</div><h2 class="verdict" id="verdict">—</h2><div class="sub" id="verdictSub"></div>
<div class="signal-rule"></div><div class="now-grid"><div class="cell"><div class="label" id="todayLabel">单日策略表现</div><div class="num num-lg" id="todayPct">—</div><div class="sub" id="todayAmt"></div></div><div class="cell"><div class="label">仓位建议</div><div class="num num-md" id="switchTxt">—</div><div class="sub" id="switchSub"></div></div></div>
</section>
<section class="panel performance" id="overview" aria-labelledby="yearTitle">
<div class="row-split"><h2 class="card-title" id="yearTitle">策略收益</h2></div>
<div class="return-row"><div class="num num-xl" id="yearRet">—</div><div class="sub" id="yearVs"></div></div>
<div id="yearSpark" class="spark-box" role="img" aria-label="本期策略收益走势"></div>
<div class="amt-row"><span class="label">模拟本金</span><div class="pills" id="amtPills" aria-label="模拟本金"><button class="pill-btn" data-amt="10000" aria-pressed="false">1 万</button><button class="pill-btn on" data-amt="100000" aria-pressed="true">10 万</button><button class="pill-btn" data-amt="1000000" aria-pressed="false">100 万</button></div></div>
<div class="metrics-grid"><div><div class="label">总市值</div><div class="num num-md" id="tMv">—</div></div><div><div class="label">累计盈亏</div><div class="num num-md" id="tPnl">—</div></div><div><div class="label">建仓成本</div><div class="num num-md" id="tCost">—</div></div><div><div class="label">策略仓位</div><div class="num num-md" id="tExp">—</div></div></div>
</section>
<section class="panel positions" id="positions" aria-labelledby="posTitle"><div class="row-split"><h2 class="card-title" id="posTitle">当年策略表现</h2></div>
<table class="pr" aria-labelledby="posTitle"><thead><tr><th scope="col">持仓</th><th scope="col" class="r">收益率</th><th scope="col" class="r">盈亏</th><th scope="col" class="r pr-detail">权重</th><th scope="col" class="r pr-detail">建仓价</th><th scope="col" class="r pr-detail">收盘价</th><th scope="col" class="r pr-detail">市值</th></tr></thead><tbody id="posRows"></tbody></table><div class="card-foot" id="posMeta"></div>
</section>
<section class="panel watchlist" aria-labelledby="nextYearTitle"><div class="row-split"><h2 class="card-title" id="nextYearTitle">次年策略预览</h2><span class="sub" id="previewNote"></span></div><div id="previewRows" class="pv-list"></div></section>
<section class="panel history" id="history" aria-labelledby="historyTitle"><div class="row-split"><h2 class="card-title" id="historyTitle">历史业绩</h2><div class="sub" id="allRange"></div></div>
<div class="history-summary"><div><div class="label">历史累计收益</div><div class="num num-xl" id="bTotal">—</div></div><div class="history-metrics"><div><div class="label">年化收益</div><div class="num num-md" id="bCagr">—</div></div><div><div class="label">最大回撤</div><div class="num num-md" id="bMdd">—</div></div><div><div class="label">盈利年份</div><div class="num num-md" id="bWin">—</div></div><div><div class="label">同期标普</div><div class="num num-md" id="bBench">—</div></div></div></div>
<div id="allChart" class="chart-box" role="img" aria-label="策略与标普500的历史收益比较，年度数值见下方明细"></div><div class="chart-footer"><div class="legend"><span><i class="dot strategy-dot"></i>策略组合</span><span><i class="dot benchmark-dot"></i>标普 500</span></div><span>历史表现不代表未来收益</span></div><p id="curveNote" class="curve-note" hidden></p></section>
<section class="panel annual" id="annual" aria-labelledby="annualTitle"><details open><summary><h2 class="card-title" id="annualTitle">策略历年效果</h2><span class="details-toggle" aria-hidden="true">年度明细 <span>⌄</span></span></summary>
<table class="yr" aria-labelledby="annualTitle"><thead><tr><th scope="col">年度</th><th scope="col" class="r">收益率</th><th scope="col" class="r">最大回撤</th><th scope="col">持仓</th></tr></thead><tbody id="yearRows"></tbody></table></details></section>
</div>
</main>
<footer class="foot"><a class="logo" href="./">LEADER<span> / </span>QUANT</a><div>仅供研究，不构成投资建议</div></footer>
<script src="assets/app.js?v=5"></script><script src="assets/page.js?v=5"></script>
</body></html>
